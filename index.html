toward farming and food production in multiple world regions."},{"name":"Agricultural revolution","definition":"The development and spread of agriculture and domestication."},{"name":"Domestication","definition":"Human selection and management of plants or animals over generations."},{"name":"Fertile Crescent","definition":"A Southwest Asian region where early farming developed, including parts of Mesopotamia."},{"name":"Diffusion","definition":"The spread of ideas, crops, technology, or practices between places."},{"name":"Food surplus","definition":"Producing more food than is immediately needed."},{"name":"Sedentary","definition":"Living in a more permanent settlement."},{"name":"Pastoral societies","definition":"Communities that depend heavily on raising domesticated herds."},{"name":"Specialization of labor","definition":"People focusing on particular jobs instead of producing all necessities themselves."},{"name":"Social stratification","definition":"A ranked arrangement of social groups with unequal power or resources."},{"name":"Patriarchy","definition":"A social system in which men hold most formal authority."},{"name":"Climate change","definition":"Long-term shifts in climate that can alter environments and human food options."}]},{"id":"civ","unit":2,"name":"Characteristics of Civilization","subtitle":"Six regions • shared patterns","summary":"Early complex societies appeared in several world regions. Many shared surplus agriculture, specialized jobs, social hierarchies, institutions, and cultural traditions.","objectives":["Locate the six regions on the map","Identify core civilization characteristics","Differentiate agrarian and pastoral societies"],"terms":[{"name":"Civilization","definition":"A complex society commonly characterized by cities, organized government, specialized labor, and cultural institutions."},{"name":"Agrarian","definition":"Relating to agriculture and settled farming."},{"name":"Social hierarchy","definition":"A ranked ordering of groups or positions in a society."},{"name":"Elite","definition":"A relatively small group holding disproportionate power or privilege."},{"name":"Monarchy","definition":"Government headed by a king, queen, or similar ruler."},{"name":"Aristocracy","definition":"Rule or influence exercised by a privileged upper class."},{"name":"Polytheism","definition":"Belief in multiple gods."},{"name":"City-state","definition":"An independent city and surrounding territory with its own government."}]},{"id":"meso","unit":2,"name":"Mesopotamia","subtitle":"Tigris & Euphrates • laws • city-states","summary":"The Tigris and Euphrates supported agriculture but could flood unpredictably. With few protective natural barriers, Mesopotamia saw competing city-states, conquest, and empires.","objectives":["Explain the effects of rivers and open terrain","Interpret unequal penalties in Hammurabi’s Code","Connect centralized government to ziggurat construction"],"terms":[{"name":"Tigris River","definition":"One of the two major rivers of Mesopotamia."},{"name":"Euphrates River","definition":"One of the two major rivers of Mesopotamia."},{"name":"Unpredictable flooding","definition":"River floods that varied in timing or intensity and could damage settlements."},{"name":"Code of Hammurabi","definition":"A Babylonian collection of laws with penalties shaped in part by social rank."},{"name":"Cuneiform","definition":"A wedge-shaped writing system used in Mesopotamia."},{"name":"Ziggurat","definition":"A monumental stepped temple complex constructed in Mesopotamian cities."},{"name":"Mesopotamia","definition":"The region between the Tigris and Euphrates rivers in Southwest Asia."},{"name":"Empire","definition":"A state ruling multiple peoples or territories, often obtained through conquest."}]},{"id":"egypt","unit":2,"name":"Ancient Egypt","subtitle":"Nile • pharaohs • theocracy","summary":"Predictable Nile flooding supported farming; deserts and other natural barriers reduced some outside contact. Pharaohs united political and religious authority.","objectives":["Explain predictable Nile flooding and natural barriers","Describe pharaohs, dynasties, and religious authority","Compare Egypt and China’s isolation and rule"],"terms":[{"name":"Nile River","definition":"River whose annual flooding enriched much of ancient Egypt’s farmland."},{"name":"Predictable flooding","definition":"Regular seasonal floods that helped people anticipate planting cycles."},{"name":"Natural barriers","definition":"Features such as deserts, seas, or mountains that can limit movement and invasions."},{"name":"Theocracy","definition":"Government in which religious authority is closely connected to political rule."},{"name":"Pharaoh","definition":"Title for the ruler of ancient Egypt."},{"name":"Dynasty","definition":"A sequence of rulers from the same family or lineage."},{"name":"Hieroglyphics","definition":"A writing system used by ancient Egyptians."},{"name":"Pyramids","definition":"Monumental tombs, including those built for Egyptian pharaohs."}]},{"id":"indus","unit":2,"name":"Indus Valley","subtitle":"Monsoons • planned cities","summary":"The Indus region supported complex urban societies. Harappa and Mohenjo-Daro are noted for street layouts and water-management systems.","objectives":["Locate the Indus River Valley","Connect monsoons and river geography to settlement","Identify planned streets and drainage systems"],"terms":[{"name":"Indus River","definition":"Major South Asian river associated with early Indus civilization."},{"name":"Monsoons","definition":"Seasonal wind patterns that bring major shifts in rainfall."},{"name":"Harappa","definition":"A major city of the ancient Indus civilization."},{"name":"Mohenjo-Daro","definition":"A major Indus city known for its urban plan and water infrastructure."},{"name":"Urban planning","definition":"Organizing streets, public spaces, and other infrastructure in a city."},{"name":"Drainage","definition":"Systems that channel wastewater or stormwater away from built areas."},{"name":"Undeciphered script","definition":"The Indus script has not been reliably deciphered; its language remains uncertain."}]},{"id":"chinaearly","unit":2,"name":"Ancient China","subtitle":"Yellow River • dynasties","summary":"The Huang He and Yangtze river systems supported early Chinese societies. Geographic barriers, dynastic traditions, oracle bones, and metalworking shaped political and cultural life.","objectives":["Identify the Yellow and Yangtze river regions","Explain dynasties and the Mandate of Heaven","Compare Egypt and China’s geographic isolation"],"terms":[{"name":"Huang He (Yellow River)","definition":"Northern Chinese river associated with early Chinese states and agriculture."},{"name":"Yangtze River","definition":"Major river flowing through central China."},{"name":"Oracle bones","definition":"Inscribed bones or shells used for divination in ancient China."},{"name":"Mandate of Heaven","definition":"The idea that a dynasty rules with Heaven’s approval and may lose that right through misrule."},{"name":"Metallurgy","definition":"The technology of working metals; ancient China developed sophisticated bronze casting."},{"name":"Cultural continuity","definition":"Preservation or development of cultural traditions over long periods."},{"name":"Shang Dynasty","definition":"Early Chinese dynasty associated with bronze casting and oracle bone inscriptions."},{"name":"Zhou Dynasty","definition":"Chinese dynasty linked with the development of the Mandate of Heaven idea."}]},{"id":"mesoamerica","unit":2,"name":"Mesoamerica","subtitle":"Maize • agricultural hearth","summary":"Mesoamerica was an independent center of agriculture, including maize domestication. Early societies provided foundations for later Maya and Aztec cultures.","objectives":["Locate Mesoamerica as an agricultural hearth","Identify maize as a major crop","Connect early societies to later Mesoamerican traditions"],"terms":[{"name":"Mesoamerica","definition":"Cultural and geographic region including central/southern Mexico and part of Central America."},{"name":"Maize (corn)","definition":"Major crop domesticated in Mesoamerica."},{"name":"Agricultural hearth","definition":"A region where farming or plant domestication developed independently or very early."},{"name":"Terrace farming","definition":"Cultivating steps cut into sloping terrain to manage land and water."},{"name":"Maya","definition":"Later Mesoamerican civilization with many city-states and distinctive cultural traditions."},{"name":"Aztec","definition":"Later Mesoamerican civilization centered in central Mexico."}]},{"id":"andes","unit":2,"name":"Andean Region","subtitle":"Potatoes • terraces • highlands","summary":"Early Andean societies adapted farming to mountainous environments. Potatoes and terrace agriculture helped support communities, laying foundations for later Andean states.","objectives":["Locate the Andes as an agricultural hearth","Identify potatoes and terrace farming","Connect early societies to later Inca traditions"],"terms":[{"name":"Andes Mountains","definition":"Long mountain chain along western South America."},{"name":"Potatoes","definition":"Crop domesticated in the Andes and important to Andean food production."},{"name":"Terrace farming","definition":"Farming on stepped slopes to reduce erosion and manage water."},{"name":"Andean Region","definition":"Mountainous western South America, where early farming traditions developed."},{"name":"Inca","definition":"Later Andean empire that built upon earlier regional traditions."}]},{"id":"zoro","unit":3,"name":"Zoroastrianism","subtitle":"Good and evil • ancient Persia","summary":"Zoroastrianism developed in ancient Iranian lands and stresses moral choices, truth, and the struggle between good and evil.","objectives":["Describe emergence and major beliefs","Explain ethical significance","Consider how religious ideas shaped society"],"terms":[{"name":"Zoroastrianism","definition":"Religious tradition of ancient Iran associated with Zarathustra and moral choice."},{"name":"Zarathustra (Zoroaster)","definition":"Religious teacher traditionally associated with Zoroastrianism."},{"name":"Avesta","definition":"Collection of sacred texts of Zoroastrianism."},{"name":"Good and evil","definition":"Central ethical opposition highlighted in Zoroastrian teaching."},{"name":"Ahura Mazda","definition":"The supreme divine being in Zoroastrianism."}]},{"id":"judaism","unit":3,"name":"Judaism","subtitle":"Ethical monotheism • Torah","summary":"Judaism is rooted in ancient Israelite traditions and teaches devotion to one God, ethical living, and the importance of sacred texts and community.","objectives":["Describe origins and key practices","Identify the Torah and Hebrew Bible","Compare the Jewish view of Jesus with Christianity and Islam"],"terms":[{"name":"Ethical monotheism","definition":"Belief in one God combined with moral obligations."},{"name":"Torah","definition":"The first five books of the Hebrew Bible; central to Jewish tradition."},{"name":"Hebrew Bible","definition":"Sacred Jewish scriptures, also called the Tanakh."},{"name":"Prophets","definition":"Figures who communicate religious and ethical messages."},{"name":"Diaspora","definition":"A people living dispersed outside an ancestral homeland."},{"name":"Abrahamic religions","definition":"Judaism, Christianity, and Islam, which share traditions linked to Abraham."}]},{"id":"christianity","unit":3,"name":"Christianity","subtitle":"Jesus • Bible • Roman world","summary":"Christianity began in the Roman world and teaches that Jesus is the Messiah and divine. Roman roads and Mediterranean connections helped early ideas spread.","objectives":["Describe emergence and major beliefs","Explain spread in the Roman Empire and Constantine’s role","Compare monasteries, Jesus, and diffusion across religions"],"terms":[{"name":"Jesus","definition":"Central figure of Christianity, regarded by Christians as the Messiah and divine."},{"name":"Christian Bible","definition":"Christian scriptures comprising the Old and New Testaments."},{"name":"Messiah","definition":"A promised anointed figure; Christians identify Jesus as the Messiah."},{"name":"Pax Romana","definition":"Period of relative peace and stability in much of the Roman Empire."},{"name":"Monasteries","definition":"Religious communities where members live under shared spiritual disciplines."},{"name":"Constantine","definition":"Roman emperor who supported Christianity and legalized its practice in the empire."},{"name":"Mediterranean","definition":"Sea whose shores and routes connected major parts of the Roman world."}]},{"id":"islam","unit":3,"name":"Islam","subtitle":"Muhammad • Qur’an • Five Pillars","summary":"Islam emerged in Arabia in the 600s CE. The Qur’an and Five Pillars guide Muslim practice; trade, scholarship, and conquest helped Islam spread.","objectives":["Describe origins and core practices","Identify Jesus as a prophet in Islam","Explain diffusion by trade and conquest"],"terms":[{"name":"Muhammad","definition":"Prophet regarded in Islam as the recipient of revelations collected in the Qur’an."},{"name":"Qur’an","definition":"Sacred text of Islam."},{"name":"Five Pillars","definition":"Core acts of worship and duty in Islam."},{"name":"Sunni and Shi’a","definition":"The two largest branches of Islam, whose historical division concerns leadership after Muhammad."},{"name":"Trans-Saharan trade","definition":"Overland exchange across the Sahara that helped spread Islam in Africa."},{"name":"Indian Ocean trade","definition":"Maritime exchange across the Indian Ocean that connected Muslim merchants with many societies."},{"name":"Jesus in Islam","definition":"Revered as a prophet, but not considered divine in Islamic belief."}]},{"id":"hinduism","unit":3,"name":"Hinduism","subtitle":"Dharma • rebirth • sacred texts","summary":"Hindu traditions developed over a long period in South Asia and include diverse beliefs about dharma, karma, reincarnation, and liberation.","objectives":["Explain major beliefs and practices","Identify the Vedas and Bhagavad Gita","Compare rebirth and liberation with Buddhism"],"terms":[{"name":"Dharma","definition":"Duty, ethical conduct, and right living; the meaning varies across Hindu traditions."},{"name":"Reincarnation","definition":"Rebirth in another life or form."},{"name":"Vedas","definition":"Ancient sacred texts of Hindu traditions."},{"name":"Bhagavad Gita","definition":"Hindu sacred text presented as a dialogue about duty and spiritual life."},{"name":"Caste system","definition":"Historical hereditary social categories that shaped status and opportunity in South Asia."},{"name":"Karma","definition":"The principle that intentional actions have moral consequences."}]},{"id":"buddhism","unit":3,"name":"Buddhism","subtitle":"Four Noble Truths • nirvana","summary":"Buddhism arose in South Asia from the teachings of Siddhartha Gautama. It examines suffering and a path to liberation, spreading widely across Asia.","objectives":["Identify the Buddha and Four Noble Truths","Explain nirvana and monasteries","Compare Ashoka with Constantine and Buddhism with Hinduism"],"terms":[{"name":"Buddha","definition":"Title meaning awakened one, associated with Siddhartha Gautama."},{"name":"Four Noble Truths","definition":"Teachings about suffering, its cause, its end, and the path toward its end."},{"name":"Nirvana","definition":"Liberation from craving and the cycle of rebirth in Buddhist teaching."},{"name":"Eightfold Path","definition":"Buddhist practices of wisdom, ethical conduct, and mental discipline."},{"name":"Ashoka","definition":"Mauryan emperor remembered for supporting and promoting Buddhism."},{"name":"Silk Roads","definition":"Overland exchange networks that helped Buddhism spread across Asia."},{"name":"Monasteries","definition":"Communities of monks or nuns dedicated to spiritual practice."}]},{"id":"confucianism","unit":3,"name":"Confucianism","subtitle":"Ethics • education • social order","summary":"Confucius taught that moral conduct, learning, proper relationships, and good example support harmonious government and society.","objectives":["Identify Confucius and the Analects","Explain orderly relationships and government by virtue","Compare with Legalism and Daoism"],"terms":[{"name":"Confucius","definition":"Chinese teacher known for ethical and political philosophy."},{"name":"Analects","definition":"A collection of sayings and conversations attributed to Confucius and his followers."},{"name":"Filial piety","definition":"Respect for parents and elders emphasized in Confucian thought."},{"name":"Social order","definition":"Stable, properly conducted relationships within families and government."},{"name":"Civil service examination","definition":"Later Chinese method of selecting some officials through examinations of learned knowledge."},{"name":"Merit and education","definition":"An ideal that capable, educated people can serve in government."}]},{"id":"legalism","unit":3,"name":"Legalism","subtitle":"Strong laws • authority • Qin","summary":"Legalists emphasized clearly enforced rules, rewards, and punishments as tools for maintaining political order. Qin rulers used Legalist approaches.","objectives":["Explain emergence during political conflict","Identify strict law and obedience to authority","Compare Legalism with Confucianism"],"terms":[{"name":"Legalism","definition":"Chinese political philosophy emphasizing strong government, explicit laws, and enforcement."},{"name":"Obedience to authority","definition":"Requirement to follow political or legal commands."},{"name":"Qin Dynasty","definition":"Dynasty that first unified China under an imperial government in 221 BCE."},{"name":"Qin Shi Huangdi","definition":"First emperor of a unified Qin China."},{"name":"Strict penalties","definition":"Legalist idea that consistent punishment can deter rule-breaking."}]},{"id":"daoism","unit":3,"name":"Daoism","subtitle":"Nature • harmony • the Dao","summary":"Daoist teachings emphasize living in harmony with the Dao or natural way, often questioning excessive government interference and rigid striving.","objectives":["Describe the development of Daoism","Identify harmony with nature","Distinguish Daoism from other Chinese philosophies"],"terms":[{"name":"Dao","definition":"The Way; a foundational concept of Daoist thought."},{"name":"Harmony with nature","definition":"Daoist ideal of living in accordance with natural patterns."},{"name":"Wu wei","definition":"An idea often translated as non-forcing or effortless action."},{"name":"Limited interference","definition":"Daoist critique of excessive rules and artificial social pressure."}]},{"id":"persia","unit":4,"name":"Persian Empire","subtitle":"Satrapies • Royal Road • toleration","summary":"The Achaemenid Persian Empire ruled a large, diverse territory. Satraps administered provinces and the Royal Road helped communications and trade.","objectives":["Locate the Persian Empire","Describe centralized rule with provincial satraps","Compare Persia’s roads and government with Rome"],"terms":[{"name":"Satrap","definition":"Governor of a Persian imperial province."},{"name":"Satrapy","definition":"Province administered by a satrap in the Persian Empire."},{"name":"Royal Road","definition":"Persian road network linking imperial centers and facilitating communications."},{"name":"Religious toleration","definition":"A policy of allowing different religious communities to practice their beliefs."},{"name":"Centralized government","definition":"A political structure where key decisions and authority are concentrated at the center."},{"name":"Cultural assimilation","definition":"A process in which cultural practices or identities change through interaction with a dominant culture."}]},{"id":"greece","unit":4,"name":"Greek City-States","subtitle":"Athens • Sparta • Alexander","summary":"Mountainous geography encouraged independent Greek city-states. Athens and Sparta developed contrasting political and social systems; Greek influence spread through conquest and contact.","objectives":["Locate and describe Greek city-states","Compare Athens and Sparta","Explain Greek achievements and the Hellenistic Era"],"terms":[{"name":"Polis","definition":"Greek city-state, typically a city and its surrounding territory."},{"name":"Democracy","definition":"Government in which citizens exercise political authority; Athenian participation was restricted."},{"name":"Aristocracy","definition":"Political power held by a privileged group."},{"name":"Sparta","definition":"Greek city-state known for a strongly militarized society and oligarchic institutions."},{"name":"Athens","definition":"Greek city-state known for its direct democracy among male citizens and cultural achievements."},{"name":"Golden Age of Athens","definition":"Period of notable Athenian cultural and political achievement in the fifth century BCE."},{"name":"Hellenistic Era","definition":"Period after Alexander’s conquests when Greek and other cultures interacted widely."},{"name":"Peloponnesian War","definition":"Long conflict between Athens and Sparta and their allies."}]},{"id":"rome","unit":4,"name":"Roman Empire","subtitle":"Republic • roads • Pax Romana","summary":"Rome grew from a republic into a far-reaching empire. Roads, law, administration, and Mediterranean networks sustained political power and helped Christianity spread.","objectives":["Locate and describe Rome’s expansion","Identify the Punic Wars and Pax Romana","Compare Roman government and roads with Persia and Greece"],"terms":[{"name":"Roman Republic","definition":"Roman government with elected officials and institutions before imperial rule."},{"name":"Roman Empire","definition":"Territories controlled by Roman emperors and imperial institutions."},{"name":"Punic Wars","definition":"Conflicts between Rome and Carthage that helped Rome dominate the western Mediterranean."},{"name":"Pax Romana","definition":"Long era of relative stability across much of the Roman Empire."},{"name":"Roman roads","definition":"Infrastructure enabling movement of troops, administrators, trade, and information."},{"name":"Local elites","definition":"Influential people within conquered communities who might cooperate with Roman rule."},{"name":"Constantine","definition":"Roman emperor associated with imperial support for Christianity."}]},{"id":"indiaemp","unit":4,"name":"Mauryan & Gupta Empires","subtitle":"Ashoka • Buddhist art • mathematics","summary":"The Mauryan Empire unified much of South Asia, and Ashoka became a major promoter of Buddhism. The later Gupta period is associated with achievements in mathematics, art, and literature.","objectives":["Locate the South Asian empires","Compare Mauryan rule and Gupta achievements","Identify zero, decimal notation, and Sanskrit literature"],"terms":[{"name":"Mauryan Empire","definition":"South Asian empire that ruled a large portion of the Indian subcontinent."},{"name":"Gupta Empire","definition":"Later South Asian dynasty associated with major cultural and scientific achievements."},{"name":"Ashoka’s pillars","definition":"Pillars with imperial inscriptions communicating Ashoka’s policies and ideals."},{"name":"Stupa","definition":"Buddhist monument associated with relics and religious practice."},{"name":"Ajanta Caves","definition":"Cave complex in India known for Buddhist art and architecture."},{"name":"Zero","definition":"Number and place-holder concept developed in South Asian mathematical traditions."},{"name":"Decimal system","definition":"Base-ten positional number system advanced in South Asian mathematics."},{"name":"Sanskrit literature","definition":"A major body of classical literature written in Sanskrit."},{"name":"Hindu-Arabic numerals","definition":"Numeral system with important origins in India, later transmitted more broadly."}]},{"id":"qinhan","unit":4,"name":"Qin & Han Dynasties","subtitle":"Unification • bureaucracy • Silk Roads","summary":"The Qin unified China with strong centralized control. The Han continued centralized imperial institutions and emphasized Confucian learning in governance.","objectives":["Locate Qin and Han China","Compare strict Qin rule and Han bureaucracy","Describe Silk Roads and classical achievements"],"terms":[{"name":"Qin Shi Huangdi","definition":"First Qin emperor, who unified China in 221 BCE."},{"name":"Legalist government","definition":"Government relying on codified law, centralized authority, and harsh enforcement."},{"name":"Han Dynasty","definition":"Chinese imperial dynasty that followed Qin and expanded imperial government and trade."},{"name":"Educated bureaucracy","definition":"Administration carried out by trained officials."},{"name":"Civil service exams","definition":"Methods of evaluating candidates for certain official positions, developed and expanded over time."},{"name":"Silk Roads","definition":"Overland trade network connecting parts of East, Central, and West Asia."},{"name":"Great Wall","definition":"Series of defensive walls built or linked by different Chinese dynasties."}]}],"people":[{"id":"hammurabi","name":"Hammurabi","unit":2,"where":"Babylonia • Mesopotamia","when":"c. 18th century BCE","role":"Babylonian king","impact":"Commissioned a famous law collection. Its penalties illustrate social hierarchy and differences in legal status.","related":["meso"]},{"id":"pharaoh","name":"The Pharaoh (office)","unit":2,"where":"Ancient Egypt","when":"Across Egyptian dynasties","role":"Political and religious ruler","impact":"The title, rather than one individual, helps explain the Egyptian theocratic state and pyramid construction.","related":["egypt"]},{"id":"confucius","name":"Confucius","unit":3,"where":"China","when":"551–479 BCE","role":"Teacher and philosopher","impact":"Promoted moral example, learning, and proper relationships as foundations for good government.","related":["confucianism"]},{"id":"zoroaster","name":"Zarathustra (Zoroaster)","unit":3,"where":"Ancient Iran","when":"Ancient era; date debated","role":"Religious teacher","impact":"Traditionally linked with Zoroastrian teachings about truth, moral choice, and good and evil.","related":["zoro"]},{"id":"abraham","name":"Abraham","unit":3,"where":"Ancient Near East","when":"Religious tradition","role":"Foundational religious figure","impact":"Important shared figure in the traditions of Judaism, Christianity, and Islam.","related":["judaism"]},{"id":"moses","name":"Moses","unit":3,"where":"Ancient Israelite tradition","when":"Religious tradition","role":"Prophet and leader","impact":"Associated with Israelite religious law and the Torah in Jewish tradition.","related":["judaism"]},{"id":"jesus","name":"Jesus of Nazareth","unit":3,"where":"Roman Judea","when":"1st century CE","role":"Religious teacher","impact":"Central figure of Christianity; Christians understand him as Messiah and divine, while Judaism and Islam view him differently.","related":["christianity","judaism","islam"]},{"id":"constantine","name":"Constantine","unit":4,"where":"Roman Empire","when":"c. 272–337 CE","role":"Roman emperor","impact":"Legalized Christian worship and supported Christianity as it expanded in the empire.","related":["rome","christianity"]},{"id":"muhammad","name":"Muhammad","unit":3,"where":"Arabian Peninsula","when":"c. 570–632 CE","role":"Prophet of Islam","impact":"Muslims regard him as the recipient of revelations contained in the Qur’an.","related":["islam"]},{"id":"buddha","name":"Siddhartha Gautama (Buddha)","unit":3,"where":"South Asia","when":"c. 5th century BCE","role":"Teacher","impact":"His teachings concern suffering, the Four Noble Truths, and a path to liberation.","related":["buddhism"]},{"id":"ashoka","name":"Ashoka","unit":4,"where":"Mauryan Empire • South Asia","when":"3rd century BCE","role":"Mauryan emperor","impact":"Promoted Buddhist principles and communicated imperial ideals through edicts and pillars.","related":["indiaemp","buddhism"]},{"id":"cyrus","name":"Cyrus the Great","unit":4,"where":"Persian Empire","when":"c. 600–530 BCE","role":"Persian ruler","impact":"Founded the Achaemenid Persian Empire and is associated with policies toward diverse subject peoples.","related":["persia"]},{"id":"darius","name":"Darius I","unit":4,"where":"Persian Empire","when":"c. 550–486 BCE","role":"Persian ruler","impact":"Strengthened imperial administration and road communications.","related":["persia"]},{"id":"pericles","name":"Pericles","unit":4,"where":"Athens","when":"c. 495–429 BCE","role":"Athenian statesman","impact":"Associated with the Golden Age of Athens and its citizen democracy.","related":["greece"]},{"id":"alexander","name":"Alexander the Great","unit":4,"where":"Macedonia • eastern Mediterranean","when":"356–323 BCE","role":"Macedonian king and conqueror","impact":"His conquests helped spread Greek language and culture and began the Hellenistic Era.","related":["greece","persia"]},{"id":"julius","name":"Julius Caesar","unit":4,"where":"Roman Republic","when":"100–44 BCE","role":"Roman general and politician","impact":"His career and assassination were major events in the Republic’s political crisis.","related":["rome"]},{"id":"augustus","name":"Augustus","unit":4,"where":"Roman Empire","when":"63 BCE–14 CE","role":"First Roman emperor","impact":"Established the imperial system after Rome’s civil wars and helped begin the Pax Romana.","related":["rome"]},{"id":"chandragupta","name":"Chandragupta Maurya","unit":4,"where":"Mauryan Empire","when":"c. 4th century BCE","role":"Founder of Mauryan dynasty","impact":"Established a large South Asian empire later ruled by his grandson Ashoka.","related":["indiaemp"]},{"id":"qin","name":"Qin Shi Huangdi","unit":4,"where":"Qin China","when":"259–210 BCE","role":"First emperor of unified China","impact":"Unification, centralization, and Legalist policies characterized ripture","zone":"a","defn":"Many Christian monastic practices center on prayer and Bible study."},{"text":"Service in Christian communities","zone":"a","defn":"Monasteries have often provided hospitality, care, and learning."},{"text":"Sangha","zone":"b","defn":"The community of Buddhist practitioners, especially ordained monks and nuns."},{"text":"Meditation and Buddhist teachings","zone":"b","defn":"Buddhist monastic practice emphasizes meditation and the Buddha’s teachings."},{"text":"Path toward enlightenment","zone":"b","defn":"Buddhist monastic discipline supports progress toward liberation."},{"text":"Communal religious discipline","zone":"both","defn":"Both developed organized communities with shared rules."},{"text":"Preserved teachings","zone":"both","defn":"Both institutions helped preserve and transmit traditions."},{"text":"Centers of learning","zone":"both","defn":"Both could provide education and learning."}]},{"id":"cmp19","name":"Christianity vs. Buddhism: Diffusion","a":"Christianity","b":"Buddhism","items":[{"text":"Roman road network","zone":"a","defn":"Routes across the Roman world aided Christian travel and communication."},{"text":"Constantine’s support","zone":"a","defn":"Constantine legalized Christianity and gave it imperial support; he did not make it the sole state religion."},{"text":"Mediterranean churches","zone":"a","defn":"Christian communities grew across Mediterranean cities."},{"text":"Silk Roads to East Asia","zone":"b","defn":"Merchants, monks, and travelers helped carry Buddhism along Asian trade routes."},{"text":"Ashoka’s patronage","zone":"b","defn":"Ashoka supported Buddhism and its teachings during the Mauryan Empire."},{"text":"Monasteries in Asia","zone":"b","defn":"Buddhist monasteries supported travelers, study, and religious communities."},{"text":"Missionaries and teachers","zone":"both","defn":"Religious teachers helped transmit teachings in both traditions."},{"text":"Political patronage","zone":"both","defn":"Rulers sometimes helped these traditions grow."},{"text":"Trade routes spread ideas","zone":"both","defn":"Movement of people and goods also moved beliefs."}]},{"id":"cmp20","name":"Persian Empire vs. Greek City-States","a":"Achaemenid Persia","b":"Greek city-states","items":[{"text":"King of Kings","zone":"a","defn":"Achaemenid Persia was ruled by a monarch claiming authority over many peoples."},{"text":"Satrapies","zone":"a","defn":"Persian territories governed through appointed provincial officials called satraps."},{"text":"Royal Road","zone":"a","defn":"The Persian road network helped imperial communication and administration."},{"text":"Independent poleis","zone":"b","defn":"Greek communities were organized into separate city-states."},{"text":"Athenian democracy","zone":"b","defn":"Athens developed a form of citizen assembly government, with important exclusions."},{"text":"Spartan oligarchy","zone":"b","defn":"Sparta was ruled by a small group of elites within its distinctive institutions."},{"text":"Military conflict","zone":"both","defn":"Both fought wars including the Greco-Persian Wars."},{"text":"Cultural and religious diversity","zone":"both","defn":"Both included varied local identities and beliefs."},{"text":"Political institutions","zone":"both","defn":"Both developed systems to organize authority and public life."}]},{"id":"cmp21","name":"Greco-Persian Wars vs. Peloponnesian War","a":"Greco-Persian Wars","b":"Peloponnesian War","items":[{"text":"Persian Empire as opponent","zone":"a","defn":"Greek coalitions fought invasions launched by the Persian Empire."},{"text":"Marathon and Salamis","zone":"a","defn":"Famous Greek victories during Persian invasion campaigns."},{"text":"Coalitions of Greek city-states","zone":"a","defn":"Greek states temporarily cooperated against Persian forces."},{"text":"Athens versus Sparta","zone":"b","defn":"The major rival powers headed opposing alliances during this war."},{"text":"431–404 BCE","zone":"b","defn":"The main period of the Peloponnesian War."},{"text":"Spartan victory","zone":"b","defn":"Sparta and its allies ultimately defeated Athens."},{"text":"Wars involving Greek city-states","zone":"both","defn":"Both conflicts deeply affected the Greek political world."},{"text":"Land and naval battles","zone":"both","defn":"Both featured fighting on land and at sea."},{"text":"Shifts in Greek power","zone":"both","defn":"Both influenced relationships among Greek communities."}]},{"id":"cmp22","name":"Greek City-States vs. Roman Empire","a":"Greek city-states","b":"Roman Empire","items":[{"text":"Independent poleis","zone":"a","defn":"Many Greek city-states governed themselves separately."},{"text":"Athenian direct democracy","zone":"a","defn":"In classical Athens, eligible male citizens voted in an assembly."},{"text":"Rivalry between Athens and Sparta","zone":"a","defn":"Competition between city-states often shaped Greek politics."},{"text":"Emperor at the center","zone":"b","defn":"Roman emperors held substantial authority over an extensive empire."},{"text":"Provincial governors","zone":"b","defn":"Roman administrators governed territories beyond Italy."},{"text":"Pax Romana","zone":"b","defn":"A long period of relative stability in the Roman imperial world."},{"text":"Mediterranean networks","zone":"both","defn":"Both were deeply connected to Mediterranean trade and culture."},{"text":"Enslaved labor","zone":"both","defn":"Both societies practiced slavery."},{"text":"Public architecture","zone":"both","defn":"Both built temples, theaters, and other public structures."}]},{"id":"cmp23","name":"Roman Republic vs. Roman Empire","a":"Roman Republic","b":"Roman Empire","items":[{"text":"Elected consuls","zone":"a","defn":"Chief magistrates were elected annually during the Republic."},{"text":"Senate and assemblies","zone":"a","defn":"Republican institutions involved a Senate and citizen voting assemblies."},{"text":"No hereditary emperor","zone":"a","defn":"The Republic did not have a permanent imperial monarchy."},{"text":"Augustus as first emperor","zone":"b","defn":"Octavian became Augustus and established the imperial principate."},{"text":"Imperial succession","zone":"b","defn":"One-person rule made succession to the imperial position a central issue."},{"text":"Pax Romana","zone":"b","defn":"The period beginning under Augustus is commonly associated with imperial peace."},{"text":"Roman Senate continued","zone":"both","defn":"A Senate existed in both periods, though its political power changed."},{"text":"Expanding Roman territory","zone":"both","defn":"Rome expanded its control across the Mediterranean in both periods."},{"text":"Roman law and citizenship","zone":"both","defn":"Roman institutions and citizenship remained important in both."}]},{"id":"cmp24","name":"Persian Royal Road vs. Roman Roads","a":"Persian road network","b":"Roman road network","items":[{"text":"Royal Road","zone":"a","defn":"Achaemenid route linking major Persian imperial centers."},{"text":"Mounted courier system","zone":"a","defn":"Persian royal messages could travel through relay stations."},{"text":"Satrapy communication","zone":"a","defn":"Roads helped Persian kings communicate with provincial governors."},{"text":"Paved engineered roads","zone":"b","defn":"Roman roads often featured carefully engineered layered surfaces."},{"text":"Legion movement","zone":"b","defn":"Roman roads enabled rapid travel for soldiers and supplies."},{"text":"Roads linking Roman provinces","zone":"b","defn":"Roads connected Rome to many provincial towns."},{"text":"Imperial administration","zone":"both","defn":"Both networks helped rulers oversee distant territory."},{"text":"Commerce and travel","zone":"both","defn":"Both supported movement of goods and people."},{"text":"Military logistics","zone":"both","defn":"Both aided movement of troops or supplies."}]},{"id":"cmp25","name":"Roman Empire vs. Han China","a":"Roman Empire","b":"Han Dynasty","items":[{"text":"Mediterranean heartland","zone":"a","defn":"Roman power centered on the Mediterranean basin."},{"text":"Latin and Roman law","zone":"a","defn":"Latin language and Roman legal institutions shaped public life."},{"text":"Roman emperors","zone":"a","defn":"Emperors claimed supreme authority in the Roman state."},{"text":"East Asian heartland","zone":"b","defn":"Han China centered on the Yellow River and other East Asian regions."},{"text":"Confucian political ideals","zone":"b","defn":"Han rulers increasingly drew on Confucian teachings about government."},{"text":"Silk Roads connections","zone":"b","defn":"Han-period trade opened wider connections across Central Asia."},{"text":"Large centralized empires","zone":"both","defn":"Both ruled extensive populations through imperial structures."},{"text":"Road and communication networks","zone":"both","defn":"Both maintained infrastructure to support government."},{"text":"Bureaucratic administration","zone":"both","defn":"Both depended on officials and administrative organization."}]},{"id":"cmp26","name":"Qin Government vs. Han Government: Deeper Look","a":"Qin","b":"Han","items":[{"text":"Legalist-inspired harsh penalties","zone":"a","defn":"The Qin state used strict laws and severe punishments."},{"text":"Shi Huangdi united China","zone":"a","defn":"Qin Shi Huangdi established the first unified Qin imperial dynasty."},{"text":"Short-lived dynasty","zone":"a","defn":"Qin rule lasted from 221 to 206 BCE."},{"text":"Confucian state education","zone":"b","defn":"Han rulers increasingly promoted Confucian learning in government."},{"text":"Silk Road links expanded","zone":"b","defn":"Han expansion and diplomacy increased Central Asian trade ties."},{"text":"Longer imperial dynasty","zone":"b","defn":"The Han ruled for centuries, despite an interruption."},{"text":"Centralized emperor","zone":"both","defn":"Both concentrated power in the imperial government."},{"text":"Officials and bureaucracy","zone":"both","defn":"Both used officials to govern territories."},{"text":"State authority over local elites","zone":"both","defn":"Both sought to limit independent regional power."}]},{"id":"cmp27","name":"Athens vs. Roman Republic","a":"Classical Athens","b":"Roman Republic","items":[{"text":"Assembly voting on laws","zone":"a","defn":"Eligible Athenian male citizens took part directly in major assembly votes."},{"text":"Council of 500","zone":"a","defn":"An Athenian council helped organize public business."},{"text":"Citizen juries by lot","zone":"a","defn":"Many Athenians served in courts after selection by lot."},{"text":"Elected magistrates","zone":"b","defn":"Roman citizens elected officials including consuls."},{"text":"Senate of leading elites","zone":"b","defn":"The Roman Senate strongly influenced policy."},{"text":"Representative elements","zone":"b","defn":"Romans elected magistrates, though the Republic was not a modern representative democracy."},{"text":"Women excluded from voting","zone":"both","defn":"Women lacked political voting rights in both systems."},{"text":"Enslaved people excluded","zone":"both","defn":"Enslaved people were not political citizens in either system."},{"text":"Citizen participation","zone":"both","defn":"Citizens had defined political roles in both."}]}],"charts":[{"title":"The six regions: geography and farming","head":["Region","Key geography","Flood / environment","Farming & lasting connection"],"rows":[["Mesopotamia","Tigris and Euphrates","Less predictable river flooding","Fertile Crescent; city-states and Babylon"],["Egypt","Nile and surrounding deserts","More predictable seasonal floods","Nile farming; pharaohs and dynasties"],["Indus Valley","Indus River, monsoons","Seasonal rain and river systems","Harappa and Mohenjo-Daro; planned cities"],["China","Huang He and Yangtze","Rivers plus mountain/desert barriers","Shang and Zhou; later Qin and Han"],["Mesoamerica","Mexico and Central America","Varied landscapes; not one defining river","Maize; foundations for fucianism","Moral leadership, social duties, learning","Analects","Chinese government and education"],["Legalism","State authority, laws, penalties","Chinese political theory","Qin centralization"],["Daoism","Harmony with the Dao; non-forcing","Daoist teachings","Chinese ethical and spiritual traditions"]]},{"title":"Classical empires at a glance","head":["Empire / region","Political theme","Achievements / connections","Curriculum comparison"],"rows":[["Persian Empire","Satrapies; imperial center","Royal Road; cultural diversity","Persian vs Roman roads"],["Greek city-states","Independent poleis","Democracy; military state; Hellenistic exchange","Athens vs Sparta"],["Roman Empire","Republic to empire","Roads; Pax Romana; Christian diffusion","Rome vs Persia / Greece"],["Mauryan Empire","Large South Asian state","Ashoka; Buddhist monuments","Ashoka vs Constantine"],["Gupta Empire","Later South Asian dynasty","Zero, decimal system, Sanskrit literature","Mauryan vs Gupta"],["Qin Dynasty","Centralized Legalist empire","Unification under Qin Shi Huangdi","Qin vs Han"],["Han Dynasty","Confucian-informed bureaucracy","Silk Roads, administration","Han vs Qin"]]},{"title":"Diffusion: routes and support","head":["Tradition","Aided by","Political patron","Key takeaway"],"rows":[["Christianity","Roman roads, Mediterranean, communities","Constantine","Travel networks and imperial support enabled growth"],["Buddhism","Monasteries, Silk Roads, missionaries","Ashoka","Teachings spread through exchange and patronage"],["Islam","Trade networks and conquest","Early Muslim states","Indian Ocean and Trans-Saharan exchange helped diffusion"]]},{"title":"Political organization: Persia, Greece, Rome, China","head":["Place / period","Political structure","How power was organized","Student comparison"],"rows":[["Achaemenid Persia","Emperor with satrapies","King governed a vast empire with provincial satraps","Centralized empire; local administration"],["Classical Greece","Independent city-states","Athens practiced limited direct democracy; Sparta had mixed oligarchic institutions","Several political systems, not one Greek government"],["Roman Republic","Magistrates, Senate, assemblies","Annual elected offices with power concentrated among elites","Republican institutions, not universal democracy"],["Roman Empire","Emperor and provincial administration","Imperial ruler relied on governors and local elites","Emperor controlled large Mediterranean territory"],["Qin China","Strong central monarchy","Emperor and officials enforced centralized rule","Centralization and Legalist policies"],["Han China","Central monarchy and bureaucracy","Imperial officials increasingly influenced by Confucian ideals","Centralized government continued, with different ideology"]]},{"title":"Empires and infrastructure: roads, routes, and administration","head":["Empire / network","Route or infrastructure","Main use","Key comparison"],"rows":[["Achaemenid Persia","Royal Road and couriers","Royal messages, armies, administration, trade","Connected satrapies across land empire"],["Roman Empire","Engineered roads and sea routes","Legion movement, travel, state communication","Connected towns and provinces"],["Han China","Roads, canals, Silk Road connections","Government travel, transport, regional and long-distance trade","Linked East Asia to Central Asian networks"],["Indian Ocean (regional context)","Monsoon-powered maritime routes","Seaborne exchange","Sea travel differs from an imperial road system"]]},{"title":"Religions in motion: how beliefs traveled","head":["Tradition","Traders and travelers","Rulers and political factors","Institutions and teaching"],"rows":[["Buddhism","Silk Roads and maritime routes carried ideas in Asia","Ashoka supported Buddhist teachings","Monasteries, monks, nuns and teachers"],["Christianity","Mediterranean movement and Roman roads helped communities connect","Constantine legalized and supported Christianity; later emperors established official status","Churches, missionaries and monastic communities"],["Islam","Caravans and Indian Ocean traders transmitted beliefs","Early Muslim empires spread political control through conquest","Mosques, scholars, merchants and religious teachers"]]},{"title":"Monasteries: Christianity and Buddhism","head":["Question","Christian communities","Buddhist communities"],"rows":[["Who joined?","Monks and nuns committed to Christian spiritual discipline","Monks and nuns within Buddhist monastic communities"],["Main spiritual focus","Prayer, scripture, worship, charitable service","Meditation, teachings, discipline and liberation"],["Learning","Preservation of Christian writings and education","Study and transmission of Buddhist texts and teachings"],["How they helped spread religion","Communities of worship and service influenced surrounding societies","Monasteries and traveling monastics supported networks of teaching"],["Caution","Christian monasteries varied across time and region","Buddhist monasteries varied across traditions and regions"]]},{"title":"War and political change in Greece and Rome","head":["Event / transition","Who or what?","Why it mattered"],"rows":[["Greco-Persian Wars","Greek coalitions confronted Persian invasions","Influenced the balance of power among Greek city-states"],["Peloponnesian War","Athens and Sparta led rival alliances","Weakened Greek city-states and changed regional leadership"],["Alexander and Hellenistic era","Macedonian conquests expanded Greek cultural influence","Mixed Greek and local traditions across parts of Asia and Africa"],["Roman Republic to Empire","Civil wars and Augustus reshaped government","Power concentrated in the emperor, though republican institutions continued"]]},{"title":"South Asian empires: Mauryan and Gupta","head":["Feature","Mauryan Empire","Gupta Empire"],"rows":[["Notable ruler","Ashoka promoted Buddhist teachings after the Kalinga War","Chandragupta II is associated with Gupta political and cultural prosperity"],["Religious context","Ashoka publicly supported Buddhism while governing diverse subjects","Hindu traditions flourished alongside other religious communities"],["Arts and architecture","Pillars and edicts of Ashoka; stupas","Ajanta painting (some phases); Sanskrit literary culture"],["Science and mathematics","Large-scale governance and communication","Advances associated with the Indian numeral system and mathematics"],["Chronology","Mauryan Empire preceded Gupta by centuries","Gupta Empire arose later; not an immediate successor"]]}],"questions":[{"deck":"paleo","stem":"What does the Out of Africa Theory describe?","correct":"Early modern humans originating in Africa and migrating outward","wrong":["All early humans settling permanently beside the Nile","The invention of farming in the Fertile Crescent","A single empire spreading from North Africa"],"why":"The theory describes human origins and migration, not the beginnings of farming or an empire.","source":"concept"},{"deck":"paleo","stem":"Which description best matches Paleolithic communities?","correct":"Small mobile groups gathering and hunting varied wild foods","wrong":["Large permanent cities collecting centralized taxes","Empire-wide armies maintaining paved road networks","Industrial workshops producing food in factories"],"why":"Paleolithic societies generally relied on wild food resources and moved with the seasons.","source":"concept"},{"deck":"paleo","stem":"Why was control of fire significant to early humans?","correct":"It helped with warmth, food preparation, and protection","wrong":["It immediately created writing systems and organized states","It made river flooding fully predictable","It ended the need for kinship groups"],"why":"Fire was an important technology, but it did not automatically produce civilization.","source":"concept"},{"deck":"neo","stem":"Which change most directly allowed some villagers to specialize in crafts?","correct":"Agricultural food surpluses","wrong":["The invention of the Roman Republic","The decline of all farming","The spread of the Pax Romana"],"why":"Extra food could support people whose daily work was not farming.","source":"concept"},{"deck":"neo","stem":"Which pair correctly contrasts nomadic and sedentary life?","correct":"Nomadic means moving regularly; sedentary means settling","wrong":["Nomadic means city-based; sedentary means hunting","Nomadic means farming only; sedentary means no crops","Nomadic means imperial; sedentary means religious"],"why":"These words describe different patterns of residence and movement.","source":"concept"},{"deck":"neo","stem":"Which was a possible social consequence of Neolithic agriculture?","correct":"Greater social stratification as occupations and resources varied","wrong":["The disappearance of all gender inequalities","A return to exclusively mobile hunting","Immediate political equality in all communities"],"why":"Farming helped produce surpluses, labor specialization, and sometimes stronger hierarchies.","source":"concept"},{"deck":"civ","stem":"Which list names all six early regions in this curriculum?","correct":"Mesopotamia, Egypt, Indus, China, Mesoamerica, Andes","wrong":["Greece, Rome, Persia, Japan, Russia, Egypt","Athens, Sparta, Carthage, Rome, Troy, Persia","Sahara, Siberia, Arctic, Atlantic, Pacific, Andes"],"why":"The unit includes four major river-valley regions and two other agricultural hearths.","source":"concept"},{"deck":"civ","stem":"Which characteristic is common in many complex civilizations?","correct":"Organized government and specialized labor","wrong":["No social distinctions of any kind","Only nomadic hunting with no settlements","No exchange of goods between communities"],"why":"Many complex societies had administrative institutions, specialization, and social hierarchies.","source":"concept"},{"deck":"civ","stem":"What does the term aristocracy describe?","correct":"Power held by a privileged upper class","wrong":["Government always led by a popular vote","A society without any ranked groups","A system where crops grow without water"],"why":"Aristocracy refers to an elite group holding political or social power.","source":"concept"},{"deck":"meso","stem":"Why was Mesopotamian geography often politically challenging?","correct":"Unpredictable rivers and few natural barriers","wrong":["Predictable annual Nile floods and vast deserts","A permanent ocean ice barrier around cities","Mountain walls sealing each valley completely"],"why":"River unpredictability and exposed terrain affected settlements and conflict.","source":"concept"},{"deck":"meso","stem":"What can the Code of Hammurabi reveal about Mesopotamian society?","correct":"Penalties often differed according to social rank","wrong":["Every person was punished in the same way","Hammurabi abolished all government institutions","The city had no established laws"],"why":"The code demonstrates formal laws and ranked legal status.","source":"concept"},{"deck":"meso","stem":"What was a ziggurat?","correct":"A monumental stepped temple complex","wrong":["An Indus Valley drainage tunnel","A Roman military camp beside a road","A Mayan sailing vessel"],"why":"Ziggurats were large Mesopotamian temple structures requiring organized labor.","source":"concept"},{"deck":"egypt","stem":"Why was Nile flooding especially useful to Egyptian farmers?","correct":"Its relatively predictable cycle renewed fertile soils","wrong":["It arrived at random without seasonal patterns","It prevented all agricultural activity","It made Egypt permanently underwater"],"why":"The seasonal Nile flood made farming more reliable in many areas.","source":"concept"},{"deck":"egypt","stem":"Which title describes Egypt’s political and sacred ruler?","correct":"Pharaoh","wrong":["Satrap","Consul","Shogun"],"why":"Pharaohs combined government leadership with sacred authority.","source":"concept"},{"deck":"egypt","stem":"What best explains ancient Egypt’s relative geographic isolation?","correct":"Surrounding deserts and other natural barriers","wrong":["No rivers and no fertile soil anywhere","A wall covering the whole continent","An ocean entirely enclosing the Nile"],"why":"Natural barriers shaped movement and contact but did not make Egypt completely isolated.","source":"concept"},{"deck":"indus","stem":"Which two cities are famous for Indus urban planning?","correct":"Harappa and Mohenjo-Daro","wrong":["Athens and Sparta","Rome and Carthage","Babylon and Persepolis"],"why":"The Indus Valley cities are noted for planned streets and drainage.","source":"concept"},{"deck":"indus","stem":"What does the undeciphered Indus script mean to historians?","correct":"Its signs are known, but their reading is not securely established","wrong":["There is proof all residents spoke Greek","The script was identical to Roman Latin","Its written laws have been fully translated"],"why":"Scholars have not reached a reliable decipherment of the Indus script.","source":"concept"},{"deck":"indus","stem":"Why did monsoons matter to South Asian societies?","correct":"Seasonal winds and rainfall influenced agriculture","wrong":["They made the entire region a permanent desert","They prevented rivers from flowing altogether","They created a Mediterranean climate in China"],"why":"Monsoons shaped water supplies and farming decisions.","source":"concept"},{"deck":"chinaearly","stem":"What did the Mandate of Heaven suggest?","correct":"Rulers could lose legitimate authority through misrule","wrong":["One family must rule forever regardless of actions","Only elected assemblies could govern China","The Nile flooded because of Roman emperors"],"why":"The idea could justify both a dynasty and its replacement.","source":"concept"},{"deck":"chinaearly","stem":"What were oracle bones used for?","correct":"Divination and recording questions or answers","wrong":["Constructing Egyptian pyramids","Paying taxes in the Roman Empire","Carrying Indian Ocean trade cargo"],"why":"Inscribed oracle bones are important evidence from early Chinese history.","source":"concept"},{"deck":"chinaearly","stem":"Which pair names important ancient Chinese river systems?","correct":"Huang He and Yangtze","wrong":["Tigris and Euphrates","Nile and Amazon","Indus and Rhine"],"why":"The Yellow River and Yangtze supported Chinese societies.","source":"concept"},{"deck":"mesoamerica","stem":"Which crop is most strongly associated with Mesoamerica’s agricultural hearth?","correct":"Maize (corn)","wrong":["Potatoes","Rice alone","Olives"],"why":"Maize was domesticated in Mesoamerica.","source":"concept"},{"deck":"mesoamerica","stem":"How do early Mesoamerican cultures relate to the Maya and Aztec?","correct":"They contributed foundations to much later societies","wrong":["They were all one unchanging government","They formed only after the Roman Empire fell","They were all located in the Andes Mountains"],"why":"The curriculum links earlier Mesoamerican traditions to later Maya and Aztec cultures.","source":"concept"},{"deck":"andes","stem":"Which crop is closely associated with early Andean agriculture?","correct":"Potatoes","wrong":["Mediterranean olives","Fertile Crescent barley alone","Chinese silk"],"why":"Potatoes were domesticated in the Andes.","source":"concept"},{"deck":"andes","stem":"Why did terrace farming help highland communities?","correct":"It made stepped mountain slopes more suitable for cultivation","wrong":["It removed the need for any water","It transformed mountains into flat oceans","It replaced agriculture with only fishing"],"why":"Terraces help manage soil, slopes, and sometimes water.","source":"concept"},{"deck":"zoro","stem":"Which religion is most associated with the struggle between good and evil in ancient Persia?","correct":"Zoroastrianism","wrong":["Confucianism","Roman civic religion alone","Daoism"],"why":"Zoroastrianism emphasizes truth, ethical choice, and good and evil.","source":"concept"},{"deck":"zoro","stem":"What is the Avesta?","correct":"Sacred writings of Zoroastrianism","wrong":["A Greek assembly law","An Indus drainage plan","A Roman emperor’s title"],"why":"The Avesta is associated with the Zoroastrian religious tradition.","source":"concept"},{"deck":"judaism","stem":"Which description best matches ethical monotheism?","correct":"Belief in one God with moral obligations","wrong":["Belief in many competing divine kings","Belief that government never needs laws","Belief that all sacred texts are identical"],"why":"Judaism emphasizes one God and ethical conduct.","source":"concept"},{"deck":"judaism","stem":"Which sacred text is especially central to Judaism?","correct":"Torah","wrong":["Qur’an","Analects","Avesta"],"why":"The Torah is part of the Hebrew Bible.","source":"concept"},{"deck":"judaism","stem":"Which statement about Jesus matches Judaism?","correct":"Jesus is not accepted as the Messiah or divine","wrong":["Jesus is worshiped as divine","Jesus is a prophet in the Qur’an","Jesus founded the Qin Dynasty"],"why":"Judaism and Christianity differ in the understanding of Jesus.","source":"concept"},{"deck":"christianity","stem":"Which belief about Jesus is central to Christianity?","correct":"He is the Messiah and divine","wrong":["He was the first Roman emperor","He authored the Qur’an","He founded Confucianism"],"why":"Christian teaching identifies Jesus as the Messiah and divine.","source":"concept"},{"deck":"christianity","stem":"Which conditions helped early Christianity spread around the Mediterranean?","correct":"Roman roads and networks during the Pax Romana","wrong":["A complete ban on all travel","The disappearance of every city","The end of all trade and common languages"],"why":"Travel infrastructure and shared networks supported diffusion.","source":"concept"},{"deck":"christianity","stem":"What role did Constantine play in Christian history?","correct":"He supported Christianity and legalized its practice in the Roman Empire","wrong":["He founded the Persian satrapy system","He wrote the Four Noble Truths","He was the first pharaoh of Egypt"],"why":"Constantine’s policies increased imperial support for Christianity.","source":"concept"},{"deck":"islam","stem":"Which text is sacred in Islam?","correct":"Qur’an","wrong":["Avesta","Analects","Bhagavad Gita"],"why":"The Qur’an is central to Islam.","source":"concept"},{"deck":"islam","stem":"How is Jesus understood in Islam?","correct":"As a respected prophet, not divine","wrong":["As the sole author of the Torah","As a Roman senator","As the founder of Buddhism"],"why":"Islam honors Jesus as a prophet but does not consider him God.","source":"concept"},{"deck":"islam","stem":"Which helped Islam spread across regions?","correct":"Conquest and networks such as Indian Ocean and Trans-Saharan trade","wrong":["Only isolation in one desert city","No movement of merchants or travelers","The disappearance of written language"],"why":"Trade and political expansion both contributed to religious diffusion.","source":"concept"},{"deck":"hinduism","stem":"Which pair names key sacred Hindu texts?","correct":"Vedas and Bhagavad Gita","wrong":["Torah and Qur’an","Analects and Avesta","Roman law and Hammurabi’s Code"],"why":"The Vedas and Bhagavad Gita are significant in Hindu traditions.","source":"concept"},{"deck":"hinduism","stem":"Which concept refers to duty and right conduct in Hindu traditions?","correct":"Dharma","wrong":["Satrapy","Pax Romana","Cuneiform"],"why":"Dharma is an important concept in Hindu religious and ethical life.","source":"concept"},{"deck":"hinduism","stem":"Which statement about Hinduism and Buddhism is most accurate?","correct":"Both address karma and rebirth, although their teachings differ","wrong":["Both have exactly the same understanding of an eternal self","Neither refers to suffering or moral conduct","Both began as Roman imperial religions"],"why":"The traditions overlap on some ideas but do not interpret all concepts alike.","source":"concept"},{"deck":"buddhism","stem" ":"Which dynasty is particularly linked with Legalist government?","correct":"Qin Dynasty","wrong":["Gupta Empire","New Kingdom Egypt","Minoan Crete"],"why":"Qin centralization used Legalist principles.","source":"concept"},{"deck":"daoism","stem":"Which idea is most closely connected with Daoism?","correct":"Harmony with the natural way","wrong":["Unlimited administrative punishment","Roman citizenship by election","The divine status of pharaohs"],"why":"Daoism values living in accordance with the Dao.","source":"concept"},{"deck":"daoism","stem":"Which view often contrasts Daoist ideas with Legalism?","correct":"Less forcing and interference compared with strict control","wrong":["Both have exactly the same views about rules","Daoism requires everyone to become soldiers","Legalism rejects all government"],"why":"Daoism often questions excessive regulation.","source":"concept"},{"deck":"persia","stem":"What was a Persian satrap?","correct":"A provincial governor","wrong":["A Roman gladiator","An Egyptian sculptor","A Buddhist monk"],"why":"Satraps administered Persian provinces, or satrapies.","source":"concept"},{"deck":"persia","stem":"How did the Royal Road strengthen Persia?","correct":"It aided communication and movement across the empire","wrong":["It stopped merchants from moving","It connected only two Egyptian pyramids","It replaced provincial government with city-states"],"why":"Roads supported imperial administration, trade, and messaging.","source":"concept"},{"deck":"persia","stem":"Which statement best describes Persian imperial rule?","correct":"A central monarch governed diverse provinces with regional officials","wrong":["The empire consisted only of one independent Greek city","The emperor abolished all regional officials","The state had no roads or organized communication"],"why":"Satrapies connected local administration with imperial authority.","source":"concept"},{"deck":"greece","stem":"How did Athens and Sparta differ?","correct":"Athens had th were direct democracies everywhere","Both had exactly the same laws and titles"],"why":"Both invested in communications and administration, despite differences in government.","source":"concept"},{"deck":"indiaemp","stem":"Which emperor is associated with pillars and the promotion of Buddhism?","correct":"Ashoka","wrong":["Augustus","Pericles","Hammurabi"],"why":"Ashoka was a Mauryan ruler who spread messages through edicts and supported Buddhism.","source":"concept"},{"deck":"indiaemp","stem":"Which set of achievements is linked with Gupta-era South Asia?","correct":"Mathematics including zero and place value, plus Sanskrit literature","wrong":["Hammurabi’s Code and ziggurats","Athenian democracy and the Punic Wars","Qin Legalist punishments and oracle bones"],"why":"The curriculum highlights Gupta cultural and mathematical achievements.","source":"concept"},{"deck":"indiaemp","stem":"Which statement best compares the Mauryan and Gupta empires?","correct":"Mauryan rule is associated with Ashoka, while Gupta rule is noted for cultural and scientific advances","wrong":["Both were the same dynasty with no gap","Gupta rulers created ancient Egyptian hieroglyphics","Mauryan rulers founded the Roman Senate"],"why":"Both were major South Asian states at different times.","source":"concept"},{"deck":"qinhan","stem":"What did Qin Shi Huangdi accomplish in 221 BCE?","correct":"Unified China under the Qin Empire","wrong":["Founded the Roman Republic","Created the Persian satrapy system","Began the Egyptian Old Kingdom"],"why":"Qin Shi Huangdi became the first emperor of unified Qin China.","source":"concept"},{"deck":"qinhan","stem":"How is Han government often contrasted with Qin government?","correct":"Han statecraft drew more on Confucian learning, while Qin used strict Legalist methods","wrong":["Qin had no central rule and Han had no officials","Han abolished all roads and written records","Both dynasties were Greek democracies"],"why":"This is a broad comparison: bot n subcontinent.","correct":"Mauryan Empire","wrong":["Satrap","Satrapy","Royal Road"],"why":"Mauryan Empire: South Asian empire that ruled a large portion of the Indian subcontinent.","source":"vocab"},{"deck":"indiaemp","stem":"Which term best matches this definition: Later South Asian dynasty associated with major cultural and scientific achievements.","correct":"Gupta Empire","wrong":["Satrap","Satrapy","Royal Road"],"why":"Gupta Empire: Later South Asian dynasty associated with major cultural and scientific achievements.","source":"vocab"},{"deck":"qinhan","stem":"Which term best matches this definition: First Qin emperor, who unified China in 221 BCE.","correct":"Qin Shi Huangdi","wrong":["Satrap","Satrapy","Royal Road"],"why":"Qin Shi Huangdi: First Qin emperor, who unified China in 221 BCE.","source":"vocab"},{"deck":"qinhan","stem":"Which term best matches this definition: Government relying on codified law, centralized authority, and harsh enforcement.","correct":"Legalist government","wrong":["Satrap","Satrapy","Royal Road"],"why":"Legalist government: Government relying on codified law, centralized authority, and harsh enforcement.","source":"vocab"}],"reasoning":[{"unit":1,"q":"Why could Neolithic villages support more specialized jobs than many Paleolithic mobile groups?","options":["People immediately stopped using stone tools.","All villages had exactly the same social structure.","Farming eliminated any need to trade.","Food surpluses could support people who did not farm full time."],"answer":3,"why":"Surplus food helped support craftworkers, merchants, officials, and other specialists; it did not end tool use or exchange."},{"unit":2,"q":"Which comparison of the Nile and Mesopotamian rivers is best supported by the course material?","options":["Nile floods were usually more predictable, shaping Egyptian farming and outlook.","Both river systems flooded at exactly the same time each year.","Mesopotamia had no irrigation farming.","Neither civilization used rivers for transportation."],"answer":0,"why":"The Nile’s generally predictable flood cycle differed from the often less predictable Tigris and Euphrates floods."},{"unit":2,"q":"Why must historians be careful when comparing Indus and Egyptian political systems?","options":["The two civilizations occupied the same river valley.","The Indus script remains undeciphered, limiting direct evidence about its rulers.","Indus cities had no planned streets.","Egyptian hieroglyphs have never been deciphered."],"answer":1,"why":"Archaeology reveals Indus urban planning, but its undeciphered script makes some political claims uncertain."},{"unit":3,"q":"Which statement correctly compares Jesus in Christianity and Islam?","options":["Islam teaches Jesus was the first Roman emperor.","Neither tradition considers Jesus important.","Christianity teaches Jesus is divine; Islam honors Jesus as a prophet, not God.","Both identify Jesus as the founder of Islam."],"answer":2,"why":"The traditions share respect for Jesus but have major theological differences about his nature and role."},{"unit":3,"q":"What is one major difference between Buddhist and Christian monasteries?","options":["Only one tradition ever included nuns.","Neither type of monastery preserved teachings.","Both require belief in the exact same sacred text.","They support different religious teachings and spiritual goals."],"answer":3,"why":"Both supported learning and religious communities, but their beliefs, practices, and aims differ."},{"unit":3,"q":"How did both Christianity and Buddhism spread beyond their places of origin?","options":["Trade routes, teachers, and support from some rulers helped their expansion.","Both spread only through military conquest.","Neither developed organized religious communities.","Both were founded by Constantine."],"answer":0,"why":"Each spread through a mix of travel, teaching, institutions, and political patronage, though routes and contexts differed."},{"unit":3,"q":"Which comparison of Ashoka and Constantine is accurate?","options":["Both declared the same religion to be the only legal faith.","Both gave major political support to a religion, but they ruled different empires in different eras.","Both were founders of Buddhism.","Both ruled the same empire at the same time."],"answer":1,"why":"Ashoka supported Buddhism in the Mauryan Empire; Constantine legalized and favored Christianity in the Roman Empire."},{"unit":3,"q":"How does Confucianism differ from Legalism in its basic approach to governing?","options":["They are identical political teachings with no important differences.","Legalism was founded in ancient Rome.","Confucianism emphasizes moral example and relationships; Legalism stresses clear laws and strict enforcement.","Confucianism rejects social order, while Legalism rejects government."],"answer":2,"why":"Both seek order but give different weight to ethical example and coercive law."},{"unit":4,"q":"What is the main structural difference between the Persian Empire and classical Greek city-states?","options":["Greece had one emperor who appointed Persian satraps.","Persia consisted only of small independent city-states.","Neither developed systems of taxation or military service.","Persia governed a large empire through a king and provinces; Greek poleis had separate governments."],"answer":3,"why":"Political organization is central: satrapies under an imperial king versus separate Greek city-state governments."},{"unit":4,"q":"Why were roads important in both the Persian and Roman empires?","options":["They strengthened communication, trade, and military coordination across territory.","They entirely eliminated the need for ships.","They were only religious pilgrimage paths.","They prevented all internal rebellions."],"answer":0,"why":"Both empires relied on connected routes to manage large distances, though designs and military uses differed."},{"unit":4,"q":"What changed as Rome moved from Republic to Empire?","options":["All residents gained equal political voting rights.","One ruler gained more concentrated authority, though some republican institutions remained.","The Senate disappeared on the first day of imperial rule.","Rome stopped governing provinces."],"answer":1,"why":"Augustus centralized control while maintaining institutions such as the Senate in altered roles."},{"unit":4,"q":"Why is it inaccurate to say Qin and Han governments were identical?","options":["The Qin used popular elections for emperor.","Only Qin China had a Chinese writing system.","Both centralized rule, but Han rulers increasingly promoted Confucian learning, unlike Qin Legalist emphasis.","The Han had no emperors or government officials."],"answer":2,"why":"The Han continued many state institutions while developing different governing ideals."},{"unit":4,"q":"Why should the Mauryan and Gupta empires not be described as one continuous dynasty?","options":["They ruled entirely different continents.","The Gupta Empire existed before the Indus Valley civilization.","Ashoka was a Gupta ruler.","They ruled in different centuries with intervening political changes."],"answer":3,"why":"The Mauryan Empire ended centuries before Gupta rule; there were important intervening states."},{"unit":4,"q":"Which statement best compares the Greco-Persian and Peloponnesian wars?","options":["The first involved Greek states fighting Persia; the second largely involved Greek states fighting each other.","Both were wars between Rome and Han China.","The Peloponnesian War ended before the Persian Empire existed.","Neither involved Athens or Sparta."],"answer":0,"why":"These conflicts had different opponents and consequences for the Greek world."},{"unit":4,"q":"Which feature was shared by the Roman Empire and Han China?","options":["Neither traded beyond its borders.","Both relied on bureaucratic administration to govern extensive territories.","Both had identical religious beliefs and languages.","Both were ruled by the same dynasty."],"answer":1,"why":"Their empires differed in many ways, but administration, roads and connectivity mattered in both."}]};
