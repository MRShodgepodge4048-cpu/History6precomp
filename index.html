const D={"topics":[{"id":"paleo","unit":1,"name":"Paleolithic Era","subtitle":"Migration • hunter-gatherers","summary":"Early Homo sapiens originated in Africa and migrated widely. Paleolithic groups generally traveled to find food and lived in small kinship communities.","objectives":["Map early migrations out of Africa","Describe nomadic hunter-gatherer life and fire use","Explain kinship groups and broad-spectrum diets"],"terms":[{"name":"Out of Africa Theory","definition":"Modern humans originated in Africa and populations migrated outward over time."},{"name":"Paleolithic Age","definition":"The Old Stone Age; humans relied primarily on gathering, hunting, and mobile lifeways."},{"name":"Homo sapiens","definition":"The human species to which people living today belong."},{"name":"Nomadic","definition":"Moving from place to place, often following seasonal resources."},{"name":"Kinship groups","definition":"Communities organized around family and close social relationships."},{"name":"Domestication of fire","definition":"Human control and use of fire for warmth, food preparation, and protection."},{"name":"Egalitarian","definition":"Relatively equal access to status or resources, though communities were not identical."},{"name":"Broad-spectrum diet","definition":"A varied diet drawing on many available wild animals and plants."},{"name":"Hunter-gatherers","definition":"People who obtain food primarily by collecting wild plants and hunting or fishing."}]},{"id":"neo","unit":1,"name":"Neolithic Era","subtitle":"Agriculture • permanent settlements","summary":"Domestication and farming helped some people settle in permanent communities. Food surpluses supported specialization, more complex hierarchies, and environmental change.","objectives":["Explain how agriculture changed the landscape","Connect food surplus to new jobs and social classes","Compare sedentary farmers with pastoral societies"],"terms":[{"name":"Neolithic Revolution","definition":"The long transition toward farming and food production in multiple world regions."},{"name":"Agricultural revolution","definition":"The development and spread of agriculture and domestication."},{"name":"Domestication","definition":"Human selection and management of plants or animals over generations."},{"name":"Fertile Crescent","definition":"A Southwest Asian region where early farming developed, including parts of Mesopotamia."},{"name":"Diffusion","definition":"The spread of ideas, crops, technology, or practices between places."},{"name":"Food surplus","definition":"Producing more food than is immediately needed."},{"name":"Sedentary","definition":"Living in a more permanent settlement."},{"name":"Pastoral societies","definition":"Communities that depend heavily on raising domesticated herds."},{"name":"Specialization of labor","definition":"People focusing on particular jobs instead of producing all necessities themselves."},{"name":"Social stratification","definition":"A ranked arrangement of social groups with unequal power or resources."},{"name":"Patriarchy","definition":"A social system in which men hold most formal authority."},{"name":"Climate change","definition":"Long-term shifts in climate that can alter environments and human food options."}]},{"id":"civ","unit":2,"name":"Characteristics of Civilization","subtitle":"Six regions • shared patterns","summary":"Early complex societies appeared in several world regions. Many shared surplus agriculture, specialized jobs, social hierarchies, institutions, and cultural traditions.","objectives":["Locate the six regions on the map","Identify core civilization characteristics","Differentiate agrarian and pastoral societies"],"terms":[{"name":"Civilization","definition":"A complex society commonly characterized by cities, organized government, specialized labor, and cultural institutions."},{"name":"Agrarian","definition":"Relating to agriculture and settled farming."},{"name":"Social hierarchy","definition":"A ranked ordering of groups or positions in a society."},{"name":"Elite","definition":"A relatively small group holding disproportionate power or privilege."},{"name":"Monarchy","definition":"Government headed by a king, queen, or similar ruler."},{"name":"Aristocracy","definition":"Rule or influence exercised by a privileged upper class."},{"name":"Polytheism","definition":"Belief in multiple gods."},{"name":"City-state","definition":"An independent city and surrounding territory with its own government."}]},{"id":"meso","unit":2,"name":"Mesopotamia","subtitle":"Tigris & Euphrates • laws • city-states","summary":"The Tigris and Euphrates supported agriculture but could flood unpredictably. With few protective natural barriers, Mesopotamia saw competing city-states, conquest, and empires.","objectives":["Explain the effects of rivers and open terrain","Interpret unequal penalties in Hammurabi’s Code","Connect centralized government to ziggurat construction"],"terms":[{"name":"Tigris River","definition":"One of the two major rivers of Mesopotamia."},{"name":"Euphrates River","definition":"One of the two major rivers of Mesopotamia."},{"name":"Unpredictable flooding","definition":"River floods that varied in timing or intensity and could damage settlements."},{"name":"Code of Hammurabi","definition":"A Babylonian collection of laws with penalties shaped in part by social rank."},{"name":"Cuneiform","definition":"A wedge-shaped writing system used in Mesopotamia."},{"name":"Ziggurat","definition":"A monumental stepped temple complex constructed in Mesopotamian cities."},{"name":"Mesopotamia","definition":"The region between the Tigris and Euphrates rivers in Southwest Asia."},{"name":"Empire","definition":"A state ruling multiple peoples or territories, often obtained through conquest."}]},{"id":"egypt","unit":2,"name":"Ancient Egypt","subtitle":"Nile • pharaohs • theocracy","summary":"Predictable Nile flooding supported farming; deserts and other natural barriers reduced some outside contact. Pharaohs united political and religious authority.","objectives":["Explain predictable Nile flooding and natural barriers","Describe pharaohs, dynasties, and religious authority","Compare Egypt and China’s isolation and rule"],"terms":[{"name":"Nile River","definition":"River whose annual flooding enriched much of ancient Egypt’s farmland."},{"name":"Predictable flooding","definition":"Regular seasonal floods that helped people anticipate planting cycles."},{"name":"Natural barriers","definition":"Features such as deserts, seas, or mountains that can limit movement and invasions."},{"name":"Theocracy","definition":"Government in which religious authority is closely connected to political rule."},{"name":"Pharaoh","definition":"Title for the ruler of ancient Egypt."},{"name":"Dynasty","definition":"A sequence of rulers from the same family or lineage."},{"name":"Hieroglyphics","definition":"A writing system used by ancient Egyptians."},{"name":"Pyramids","definition":"Monumental tombs, including those built for Egyptian pharaohs."}]},{"id":"indus","unit":2,"name":"Indus Valley","subtitle":"Monsoons • planned cities","summary":"The Indus region supported complex urban societies. Harappa and Mohenjo-Daro are noted for street layouts and water-management systems.","objectives":["Locate the Indus River Valley","Connect monsoons and river geography to settlement","Identify planned streets and drainage systems"],"terms":[{"name":"Indus River","definition":"Major South Asian river associated with early Indus civilization."},{"name":"Monsoons","definition":"Seasonal wind patterns that bring major shifts in rainfall."},{"name":"Harappa","definition":"A major city of the ancient Indus civilization."},{"name":"Mohenjo-Daro","definition":"A major Indus city known for its urban plan and water infrastructure."},{"name":"Urban planning","definition":"Organizing streets, public spaces, and other infrastructure in a city."},{"name":"Drainage","definition":"Systems that channel wastewater or stormwater away from built areas."},{"name":"Undeciphered script","definition":"The Indus script has not been reliably deciphered; its language remains uncertain."}]},{"id":"chinaearly","unit":2,"name":"Ancient China","subtitle":"Yellow River • dynasties","summary":"The Huang He and Yangtze river systems supported early Chinese societies. Geographic barriers, dynastic traditions, oracle bones, and metalworking shaped political and cultural life.","objectives":["Identify the Yellow and Yangtze river regions","Explain dynasties and the Mandate of Heaven","Compare Egypt and China’s geographic isolation"],"terms":[{"name":"Huang He (Yellow River)","definition":"Northern Chinese river associated with early Chinese states and agriculture."},{"name":"Yangtze River","definition":"Major river flowing through central China."},{"name":"Oracle bones","definition":"Inscribed bones or shells used for divination in ancient China."},{"name":"Mandate of Heaven","definition":"The idea that a dynasty rules with Heaven’s approval and may lose that right through misrule."},{"name":"Metallurgy","definition":"The technology of working metals; ancient China developed sophisticated bronze casting."},{"name":"Cultural continuity","definition":"Preservation or development of cultural traditions over long periods."},{"name":"Shang Dynasty","definition":"Early Chinese dynasty associated with bronze casting and oracle bone inscriptions."},{"name":"Zhou Dynasty","definition":"Chinese dynasty linked with the development of the Mandate of Heaven idea."}]},{"id":"mesoamerica","unit":2,"name":"Mesoamerica","subtitle":"Maize • agricultural hearth","summary":"Mesoamerica was an independent center of agriculture, including maize domestication. Early societies provided foundations for later Maya and Aztec cultures.","objectives":["Locate Mesoamerica as an agricultural hearth","Identify maize as a major crop","Connect early societies to later Mesoamerican traditions"],"terms":[{"name":"Mesoamerica","definition":"Cultural and geographic region including central/southern Mexico and part of Central America."},{"name":"Maize (corn)","definition":"Major crop domesticated in Mesoamerica."},{"name":"Agricultural hearth","definition":"A region where farming or plant domestication developed independently or very early."},{"name":"Terrace farming","definition":"Cultivating steps cut into sloping terrain to manage land and water."},{"name":"Maya","definition":"Later Mesoamerican civilization with many city-states and distinctive cultural traditions."},{"name":"Aztec","definition":"Later Mesoamerican civilization centered in central Mexico."}]},{"id":"andes","unit":2,"name":"Andean Region","subtitle":"Potatoes • terraces • highlands","summary":"Early Andean societies adapted farming to mountainous environments. Potatoes and terrace agriculture helped support communities, laying foundations for later Andean states.","objectives":["Locate the Andes as an agricultural hearth","Identify potatoes and terrace farming","Connect early societies to later Inca traditions"],"terms":[{"name":"Andes Mountains","definition":"Long mountain chain along western South America."},{"name":"Potatoes","definition":"Crop domesticated in the Andes and important to Andean food production."},{"name":"Terrace farming","definition":"Farming on stepped slopes to reduce erosion and manage water."},{"name":"Andean Region","definition":"Mountainous western South America, where early farming traditions developed."},{"name":"Inca","definition":"Later Andean empire that built upon earlier regional traditions."}]},{"id":"zoro","unit":3,"name":"Zoroastrianism","subtitle":"Good and evil • ancient Persia","summary":"Zoroastrianism developed in ancient Iranian lands and stresses moral choices, truth, and the struggle between good and evil.","objectives":["Describe emergence and major beliefs","Explain ethical significance","Consider how religious ideas shaped society"],"terms":[{"name":"Zoroastrianism","definition":"Religious tradition of ancient Iran associated with Zarathustra and moral choice."},{"name":"Zarathustra (Zoroaster)","definition":"Religious teacher traditionally associated with Zoroastrianism."},{"name":"Avesta","definition":"Collection of sacred texts of Zoroastrianism."},{"name":"Good and evil","definition":"Central ethical opposition highlighted in Zoroastrian teaching."},{"name":"Ahura Mazda","definition":"The supreme divine being in Zoroastrianism."}]},{"id":"judaism","unit":3,"name":"Judaism","subtitle":"Ethical monotheism • Torah","summary":"Judaism is rooted in ancient Israelite traditions and teaches devotion to one God, ethical living, and the importance of sacred texts and community.","objectives":["Describe origins and key practices","Identify the Torah and Hebrew Bible","Compare the Jewish view of Jesus with Christianity and Islam"],"terms":[{"name":"Ethical monotheism","definition":"Belief in one God combined with moral obligations."},{"name":"Torah","definition":"The first five books of the Hebrew Bible; central to Jewish tradition."},{"name":"Hebrew Bible","definition":"Sacred Jewish scriptures, also called the Tanakh."},{"name":"Prophets","definition":"Figures who communicate religious and ethical messages."},{"name":"Diaspora","definition":"A people living dispersed outside an ancestral homeland."},{"name":"Abrahamic religions","definition":"Judaism, Christianity, and Islam, which share traditions linked to Abraham."}]},{"id":"christianity","unit":3,"name":"Christianity","subtitle":"Jesus • Bible • Roman world","summary":"Christianity began in the Roman world and teaches that Jesus is the Messiah and divine. Roman roads and Mediterranean connections helped early ideas spread.","objectives":["Describe emergence and major beliefs","Explain spread in the Roman Empire and Constantine’s role","Compare monasteries, Jesus, and diffusion across religions"],"terms":[{"name":"Jesus","definition":"Central figure of Christianity, regarded by Christians as the Messiah and divine."},{"name":"Christian Bible","definition":"Christian scriptures comprising the Old and New Testaments."},{"name":"Messiah","definition":"A promised anointed figure; Christians identify Jesus as the Messiah."},{"name":"Pax Romana","definition":"Period of relative peace and stability in much of the Roman Empire."},{"name":"Monasteries","definition":"Religious communities where members live under shared spiritual disciplines."},{"name":"Constantine","definition":"Roman emperor who supported Christianity and legalized its practice in the empire."},{"name":"Mediterranean","definition":"Sea whose shores and routes connected major parts of the Roman world."}]},{"id":"islam","unit":3,"name":"Islam","subtitle":"Muhammad • Qur’an • Five Pillars","summary":"Islam emerged in Arabia in the 600s CE. The Qur’an and Five Pillars guide Muslim practice; trade, scholarship, and conquest helped Islam spread.","objectives":["Describe origins and core practices","Identify Jesus as a prophet in Islam","Explain diffusion by trade and conquest"],"terms":[{"name":"Muhammad","definition":"Prophet regarded in Islam as the recipient of revelations collected in the Qur’an."},{"name":"Qur’an","definition":"Sacred text of Islam."},{"name":"Five Pillars","definition":"Core acts of worship and duty in Islam."},{"name":"Sunni and Shi’a","definition":"The two largest branches of Islam, whose historical division concerns leadership after Muhammad."},{"name":"Trans-Saharan trade","definition":"Overland exchange across the Sahara that helped spread Islam in Africa."},{"name":"Indian Ocean trade","definition":"Maritime exchange across the Indian Ocean that connected Muslim merchants with many societies."},{"name":"Jesus in Islam","definition":"Revered as a prophet, but not considered divine in Islamic belief."}]},{"id":"hinduism","unit":3,"name":"Hinduism","subtitle":"Dharma • rebirth • sacred texts","summary":"Hindu traditions developed over a long period in South Asia and include diverse beliefs about dharma, karma, reincarnation, and liberation.","objectives":["Explain major beliefs and practices","Identify the Vedas and Bhagavad Gita","Compare rebirth and liberation with Buddhism"],"terms":[{"name":"Dharma","definition":"Duty, ethical conduct, and right living; the meaning varies across Hindu traditions."},{"name":"Reincarnation","definition":"Rebirth in another life or form."},{"name":"Vedas","definition":"Ancient sacred texts of Hindu traditions."},{"name":"Bhagavad Gita","definition":"Hindu sacred text presented as a dialogue about duty and spiritual life."},{"name":"Caste system","definition":"Historical hereditary social categories that shaped status and opportunity in South Asia."},{"name":"Karma","definition":"The principle that intentional actions have moral consequences."}]},{"id":"buddhism","unit":3,"name":"Buddhism","subtitle":"Four Noble Truths • nirvana","summary":"Buddhism arose in South Asia from the teachings of Siddhartha Gautama. It examines suffering and a path to liberation, spreading widely across Asia.","objectives":["Identify the Buddha and Four Noble Truths","Explain nirvana and monasteries","Compare Ashoka with Constantine and Buddhism with Hinduism"],"terms":[{"name":"Buddha","definition":"Title meaning awakened one, associated with Siddhartha Gautama."},{"name":"Four Noble Truths","definition":"Teachings about suffering, its cause, its end, and the path toward its end."},{"name":"Nirvana","definition":"Liberation from craving and the cycle of rebirth in Buddhist teaching."},{"name":"Eightfold Path","definition":"Buddhist practices of wisdom, ethical conduct, and mental discipline."},{"name":"Ashoka","definition":"Mauryan emperor remembered for supporting and promoting Buddhism."},{"name":"Silk Roads","definition":"Overland exchange networks that helped Buddhism spread across Asia."},{"name":"Monasteries","definition":"Communities of monks or nuns dedicated to spiritual practice."}]},{"id":"confucianism","unit":3,"name":"Confucianism","subtitle":"Ethics • education • social order","summary":"Confucius taught that moral conduct, learning, proper relationships, and good example support harmonious government and society.","objectives":["Identify Confucius and the Analects","Explain orderly relationships and government by virtue","Compare with Legalism and Daoism"],"terms":[{"name":"Confucius","definition":"Chinese teacher known for ethical and political philosophy."},{"name":"Analects","definition":"A collection of sayings and conversations attributed to Confucius and his followers."},{"name":"Filial piety","definition":"Respect for parents and elders emphasized in Confucian thought."},{"name":"Social order","definition":"Stable, properly conducted relationships within families and government."},{"name":"Civil service examination","definition":"Later Chinese method of selecting some officials through examinations of learned knowledge."},{"name":"Merit and education","definition":"An ideal that capable, educated people can serve in government."}]},{"id":"legalism","unit":3,"name":"Legalism","subtitle":"Strong laws • authority • Qin","summary":"Legalists emphasized clearly enforced rules, rewards, and punishments as tools for maintaining political order. Qin rulers used Legalist approaches.","objectives":["Explain emergence during political conflict","Identify strict law and obedience to authority","Compare Legalism with Confucianism"],"terms":[{"name":"Legalism","definition":"Chinese political philosophy emphasizing strong government, explicit laws, and enforcement."},{"name":"Obedience to authority","definition":"Requirement to follow political or legal commands."},{"name":"Qin Dynasty","definition":"Dynasty that first unified China under an imperial government in 221 BCE."},{"name":"Qin Shi Huangdi","definition":"First emperor of a unified Qin China."},{"name":"Strict penalties","definition":"Legalist idea that consistent punishment can deter rule-breaking."}]},{"id":"daoism","unit":3,"name":"Daoism","subtitle":"Nature • harmony • the Dao","summary":"Daoist teachings emphasize living in harmony with the Dao or natural way, often questioning excessive government interference and rigid striving.","objectives":["Describe the development of Daoism","Identify harmony with nature","Distinguish Daoism from other Chinese philosophies"],"terms":[{"name":"Dao","definition":"The Way; a foundational concept of Daoist thought."},{"name":"Harmony with nature","definition":"Daoist ideal of living in accordance with natural patterns."},{"name":"Wu wei","definition":"An idea often translated as non-forcing or effortless action."},{"name":"Limited interference","definition":"Daoist critique of excessive rules and artificial social pressure."}]},{"id":"persia","unit":4,"name":"Persian Empire","subtitle":"Satrapies • Royal Road • toleration","summary":"The Achaemenid Persian Empire ruled a large, diverse territory. Satraps administered provinces and the Royal Road helped communications and trade.","objectives":["Locate the Persian Empire","Describe centralized rule with provincial satraps","Compare Persia’s roads and government with Rome"],"terms":[{"name":"Satrap","definition":"Governor of a Persian imperial province."},{"name":"Satrapy","definition":"Province administered by a satrap in the Persian Empire."},{"name":"Royal Road","definition":"Persian road network linking imperial centers and facilitating communications."},{"name":"Religious toleration","definition":"A policy of allowing different religious communities to practice their beliefs."},{"name":"Centralized government","definition":"A political structure where key decisions and authority are concentrated at the center."},{"name":"Cultural assimilation","definition":"A process in which cultural practices or identities change through interaction with a dominant culture."}]},{"id":"greece","unit":4,"name":"Greek City-States","subtitle":"Athens • Sparta • Alexander","summary":"Mountainous geography encouraged independent Greek city-states. Athens and Sparta developed contrasting political and social systems; Greek influence spread through conquest and contact.","objectives":["Locate and describe Greek city-states","Compare Athens and Sparta","Explain Greek achievements and the Hellenistic Era"],"terms":[{"name":"Polis","definition":"Greek city-state, typically a city and its surrounding territory."},{"name":"Democracy","definition":"Government in which citizens exercise political authority; Athenian participation was restricted."},{"name":"Aristocracy","definition":"Political power held by a privileged group."},{"name":"Sparta","definition":"Greek city-state known for a strongly militarized society and oligarchic institutions."},{"name":"Athens","definition":"Greek city-state known for its direct democracy among male citizens and cultural achievements."},{"name":"Golden Age of Athens","definition":"Period of notable Athenian cultural and political achievement in the fifth century BCE."},{"name":"Hellenistic Era","definition":"Period after Alexander’s conquests when Greek and other cultures interacted widely."},{"name":"Peloponnesian War","definition":"Long conflict between Athens and Sparta and their allies."}]},{"id":"rome","unit":4,"name":"Roman Empire","subtitle":"Republic • Punic Wars • Pax Romana","summary":"Rome developed from a republic into a Mediterranean empire. The Punic Wars against Carthage (264–146 BCE) helped Rome dominate the western Mediterranean. Roman roads, law, government, and cultural exchange later linked a vast empire.","objectives":["Locate the Roman Republic, Carthage, and the Mediterranean regions affected by the Punic Wars","Explain the Punic Wars and the growth of Roman power","Describe the Pax Romana, Roman government, roads, and the diffusion of Christianity","Compare Rome with the Greek city-states and the Persian Empire"],"terms":[{"name":"Roman Republic","definition":"Roman government with elected officials and institutions before imperial rule."},{"name":"Roman Empire","definition":"Territories controlled by Roman emperors and imperial institutions."},{"name":"Punic Wars","definition":"Conflicts between Rome and Carthage that helped Rome dominate the western Mediterranean."},{"name":"Pax Romana","definition":"Long era of relative stability across much of the Roman Empire."},{"name":"Roman roads","definition":"Infrastructure enabling movement of troops, administrators, trade, and information."},{"name":"Local elites","definition":"Influential people within conquered communities who might cooperate with Roman rule."},{"name":"Constantine","definition":"Roman emperor associated with imperial support for Christianity."},{"name":"Carthage","definition":"Major maritime power centered in North Africa near present-day Tunis; Rome’s rival in the Punic Wars."},{"name":"Hannibal","definition":"Carthaginian commander who led his forces from Iberia across the Alps into Italy in 218 BCE."},{"name":"First Punic War (264–241 BCE)","definition":"War centered on Sicily; Rome won and took control of Sicily."},{"name":"Second Punic War (218–201 BCE)","definition":"Hannibal invaded Italy; Rome eventually defeated Carthage, winning at Zama in 202 BCE."},{"name":"Third Punic War (149–146 BCE)","definition":"Rome besieged and destroyed Carthage, expanding Roman control in North Africa."}]},{"id":"indiaemp","unit":4,"name":"Mauryan & Gupta Empires","subtitle":"Ashoka • Buddhist art • mathematics","summary":"The Mauryan Empire unified much of South Asia, and Ashoka became a major promoter of Buddhism. The later Gupta period is associated with achievements in mathematics, art, and literature.","objectives":["Locate the South Asian empires","Compare Mauryan rule and Gupta achievements","Identify zero, decimal notation, and Sanskrit literature"],"terms":[{"name":"Mauryan Empire","definition":"South Asian empire that ruled a large portion of the Indian subcontinent."},{"name":"Gupta Empire","definition":"Later South Asian dynasty associated with major cultural and scientific achievements."},{"name":"Ashoka’s pillars","definition":"Pillars with imperial inscriptions communicating Ashoka’s policies and ideals."},{"name":"Stupa","definition":"Buddhist monument associated with relics and religious practice."},{"name":"Ajanta Caves","definition":"Cave complex in India known for Buddhist art and architecture."},{"name":"Zero","definition":"Number and place-holder concept developed in South Asian mathematical traditions."},{"name":"Decimal system","definition":"Base-ten positional number system advanced in South Asian mathematics."},{"name":"Sanskrit literature","definition":"A major body of classical literature written in Sanskrit."},{"name":"Hindu-Arabic numerals","definition":"Numeral system with important origins in India, later transmitted more broadly."}]},{"id":"qinhan","unit":4,"name":"Qin & Han Dynasties","subtitle":"Unification • bureaucracy • Silk Roads","summary":"The Qin unified China with strong centralized control. The Han continued centralized imperial institutions and emphasized Confucian learning in governance.","objectives":["Locate Qin and Han China","Compare strict Qin rule and Han bureaucracy","Describe Silk Roads and classical achievements"],"terms":[{"name":"Qin Shi Huangdi","definition":"First Qin emperor, who unified China in 221 BCE."},{"name":"Legalist government","definition":"Government relying on codified law, centralized authority, and harsh enforcement."},{"name":"Han Dynasty","definition":"Chinese imperial dynasty that followed Qin and expanded imperial government and trade."},{"name":"Educated bureaucracy","definition":"Administration carried out by trained officials."},{"name":"Civil service exams","definition":"Methods of evaluating candidates for certain official positions, developed and expanded over time."},{"name":"Silk Roads","definition":"Overland trade network connecting parts of East, Central, and West Asia."},{"name":"Great Wall","definition":"Series of defensive walls built or linked by different Chinese dynasties."}]}],"people":[{"id":"hammurabi","name":"Hammurabi","unit":2,"where":"Babylonia • Mesopotamia","when":"c. 18th century BCE","role":"Babylonian king","impact":"Commissioned a famous law collection. Its penalties illustrate social hierarchy and differences in legal status.","related":["meso"]},{"id":"pharaoh","name":"The Pharaoh (office)","unit":2,"where":"Ancient Egypt","when":"Across Egyptian dynasties","role":"Political and religious ruler","impact":"The title, rather than one individual, helps explain the Egyptian theocratic state and pyramid construction.","related":["egypt"]},{"id":"confucius","name":"Confucius","unit":3,"where":"China","when":"551–479 BCE","role":"Teacher and philosopher","impact":"Promoted moral example, learning, and proper relationships as foundations for good government.","related":["confucianism"]},{"id":"zoroaster","name":"Zarathustra (Zoroaster)","unit":3,"where":"Ancient Iran","when":"Ancient era; date debated","role":"Religious teacher","impact":"Traditionally linked with Zoroastrian teachings about truth, moral choice, and good and evil.","related":["zoro"]},{"id":"abraham","name":"Abraham","unit":3,"where":"Ancient Near East","when":"Religious tradition","role":"Foundational religious figure","impact":"Important shared figure in the traditions of Judaism, Christianity, and Islam.","related":["judaism"]},{"id":"moses","name":"Moses","unit":3,"where":"Ancient Israelite tradition","when":"Religious tradition","role":"Prophet and leader","impact":"Associated with Israelite religious law and the Torah in Jewish tradition.","related":["judaism"]},{"id":"jesus","name":"Jesus of Nazareth","unit":3,"where":"Roman Judea","when":"1st century CE","role":"Religious teacher","impact":"Central figure of Christianity; Christians understand him as Messiah and divine, while Judaism and Islam view him differently.","related":["christianity","judaism","islam"]},{"id":"constantine","name":"Constantine","unit":4,"where":"Roman Empire","when":"c. 272–337 CE","role":"Roman emperor","impact":"Legalized Christian worship and supported Christianity as it expanded in the empire.","related":["rome","christianity"]},{"id":"muhammad","name":"Muhammad","unit":3,"where":"Arabian Peninsula","when":"c. 570–632 CE","role":"Prophet of Islam","impact":"Muslims regard him as the recipient of revelations contained in the Qur’an.","related":["islam"]},{"id":"buddha","name":"Siddhartha Gautama (Buddha)","unit":3,"where":"South Asia","when":"c. 5th century BCE","role":"Teacher","impact":"His teachings concern suffering, the Four Noble Truths, and a path to liberation.","related":["buddhism"]},{"id":"ashoka","name":"Ashoka","unit":4,"where":"Mauryan Empire • South Asia","when":"3rd century BCE","role":"Mauryan emperor","impact":"Promoted Buddhist principles and communicated imperial ideals through edicts and pillars.","related":["indiaemp","buddhism"]},{"id":"cyrus","name":"Cyrus the Great","unit":4,"where":"Persian Empire","when":"c. 600–530 BCE","role":"Persian ruler","impact":"Founded the Achaemenid Persian Empire and is associated with policies toward diverse subject peoples.","related":["persia"]},{"id":"darius","name":"Darius I","unit":4,"where":"Persian Empire","when":"c. 550–486 BCE","role":"Persian ruler","impact":"Strengthened imperial administration and road communications.","related":["persia"]},{"id":"pericles","name":"Pericles","unit":4,"where":"Athens","when":"c. 495–429 BCE","role":"Athenian statesman","impact":"Associated with the Golden Age of Athens and its citizen democracy.","related":["greece"]},{"id":"alexander","name":"Alexander the Great","unit":4,"where":"Macedonia • eastern Mediterranean","when":"356–323 BCE","role":"Macedonian king and conqueror","impact":"His conquests helped spread Greek language and culture and began the Hellenistic Era.","related":["greece","persia"]},{"id":"julius","name":"Julius Caesar","unit":4, ities.","features":["Maize domestication","Early city-states","Foundations for later civilizations"],"links":[["Early Mesoamerican societies","Unit 2 foundation","Early farming and urban traditions.","mesoamerica"],["Maya cultures","Later connection · beyond this unit","Developed many city-states. Mentioned in Unit 2 as a later cultural connection.","mesoamerica"],["Aztec Empire","Later connection · beyond this unit","A much later civilization; linked as a foundation, not a Unit 4 empire.","mesoamerica"]]},{"id":"andes","name":"Andean Region","kind":"hearth","lon":-74,"lat":-14,"river":"Andean mountain environments","agriculture":"Potatoes","overview":"High-altitude agricultural hearth known for potatoes and adaptation through terrace farming.","features":["Andes Mountains","Potato domestication","Terrace farming"],"links":[["Early Andean societies","Unit 2 foundation","Farmed in varied highland and coastal environments.","andes"],["Inca Empire","Later connection · beyond this unit","Developed many centuries afterward; not included as a Unit 4 empire.","andes"]]}],"empires":[{"id":"persia","name":"Achaemenid Persian Empire (c. 500 BCE)","lon":53,"lat":33,"desc":"A vast empire spanning Southwest Asia, Egypt, and regions farther east. Satrapies, the Royal Road, and provincial administration connected its peoples.","topic":"persia"},{"id":"greece","name":"Greek city-states (c. 450 BCE)","lon":24,"lat":38,"desc":"Independent city-states, not one empire. The highlighted zone shows the Greek mainland and Aegean core associated with Athens, Sparta, and other poleis.","topic":"greece"},{"id":"alexander","name":"Alexander’s Empire (323 BCE)","lon":46,"lat":35,"desc":"Alexander conquered the Achaemenid Persian Empire and territories from Greece and Egypt across Southwest Asia to the Indus region. His empire fragmented soon after his death.","topic":"greece"},{"id":"romanrepublic","name":"Roman Republic (218 BCE)","lon":13,"lat":41,"desc":"During the Second Punic War, Rome con ts were large Mesopotamian temple structures requiring organized labor.","source":"concept"},{"deck":"egypt","stem":"Why was Nile flooding especially useful to Egyptian farmers?","correct":"Its relatively predictable cycle renewed fertile soils","wrong":["It arrived at random without seasonal patterns","It prevented all agricultural activity","It made Egypt permanently underwater"],"why":"The seasonal Nile flood made farming more reliable in many areas.","source":"concept"},{"deck":"egypt","stem":"Which title describes Egypt’s political and sacred ruler?","correct":"Pharaoh","wrong":["Satrap","Consul","Shogun"],"why":"Pharaohs combined government leadership with sacred authority.","source":"concept"},{"deck":"egypt","stem":"What best explains ancient Egypt’s relative geographic isolation?","correct":"Surrounding deserts and other natural barriers","wrong":["No rivers and no fertile soil anywhere","A wall covering the whole continent","An ocean entirely enclosing the Nile"],"why":"Natural barriers shaped movement and contact but did not make Egypt completely isolated.","source":"concept"},{"deck":"indus","stem":"Which two cities are famous for Indus urban planning?","correct":"Harappa and Mohenjo-Daro","wrong":["Athens and Sparta","Rome and Carthage","Babylon and Persepolis"],"why":"The Indus Valley cities are noted for planned streets and drainage.","source":"concept"},{"deck":"indus","stem":"What does the undeciphered Indus script mean to historians?","correct":"Its signs are known, but their reading is not securely established","wrong":["There is proof all residents spoke Greek","The script was identical to Roman Latin","Its written laws have been fully translated"],"why":"Scholars have not reached a reliable decipherment of the Indus script.","source":"concept"},{"deck":"indus","stem":"Why did monsoons matter to South Asian societies?","correct":"Seasonal winds and rainfall influenced agriculture","wrong":["They made the entire region a permanent desert","They prevented rivers from flowing altogether","They created a Mediterranean climate in China"],"why":"Monsoons shaped water supplies and farming decisions.","source":"concept"},{"deck":"chinaearly","stem":"What did the Mandate of Heaven suggest?","correct":"Rulers could lose legitimate authority through misrule","wrong":["One family must rule forever regardless of actions","Only elected assemblies could govern China","The Nile flooded because of Roman emperors"],"why":"The idea could justify both a dynasty and its replacement.","source":"concept"},{"deck":"chinaearly","stem":"What were oracle bones used for?","correct":"Divination and recording questions or answers","wrong":["Constructing Egyptian pyramids","Paying taxes in the Roman Empire","Carrying Indian Ocean trade cargo"],"why":"Inscribed oracle bones are important evidence from early Chinese history.","source":"concept"},{"deck":"chinaearly","stem":"Which pair names important ancient Chinese river systems?","correct":"Huang He and Yangtze","wrong":["Tigris and Euphrates","Nile and Amazon","Indus and Rhine"],"why":"The Yellow River and Yangtze supported Chinese societies.","source":"concept"},{"deck":"mesoamerica","stem":"Which crop is most strongly associated with Mesoamerica’s agricultural hearth?","correct":"Maize (corn)","wrong":["Potatoes","Rice alone","Olives"],"why":"Maize was domesticated in Mesoamerica.","source":"concept"},{"deck":"mesoamerica","stem":"How do early Mesoamerican cultures relate to the Maya and Aztec?","correct":"They contributed foundations to much later societies","wrong":["They were all one unchanging government","They formed only after the Roman Empire fell","They were all located in the Andes Mountains"],"why":"The curriculum links earlier Mesoamerican traditions to later Maya and Aztec cultures.","source":"concept"},{"deck":"andes","stem":"Which crop is closely associated with early Andean agriculture?","correct":"Potatoes","wrong":["Mediterranean olives","Fertile Crescent barley alone","Chinese silk"],"why":"Potatoes were domesticated in the Andes.","source":"concept"},{"deck":"andes","stem":"Why did terrace farming help highland communities?","correct":"It made stepped mountain slopes more suitable for cultivation","wrong":["It removed the need for any water","It transformed mountains into flat oceans","It replaced agriculture with only fishing"],"why":"Terraces help manage soil, slopes, and sometimes water.","source":"concept"},{"deck":"zoro","stem":"Which religion is most associated with the struggle between good and evil in ancient Persia?","correct":"Zoroastrianism","wrong":["Confucianism","Roman civic religion alone","Daoism"],"why":"Zoroastrianism emphasizes truth, ethical choice, and good and evil.","source":"concept"},{"deck":"zoro","stem":"What is the Avesta?","correct":"Sacred writings of Zoroastrianism","wrong":["A Greek assembly law","An Indus drainage plan","A Roman emperor’s title"],"why":"The Avesta is associated with the Zoroastrian religious tradition.","source":"concept"},{"deck":"judaism","stem":"Which description best matches ethical monotheism?","correct":"Belief in one God with moral obligations","wrong":["Belief in many competing divine kings","Belief that government never needs laws","Belief that all sacred texts are identical"],"why":"Judaism emphasizes one God and ethical conduct.","source":"concept"},{"deck":"judaism","stem":"Which sacred text is especially central to Judaism?","correct":"Torah","wrong":["Qur’an","Analects","Avesta"],"why":"The Torah is part of the Hebrew Bible.","source":"concept"},{"deck":"judaism","stem":"Which statement about Jesus matches Judaism?","correct":"Jesus is not accepted as the Messiah or divine","wrong":["Jesus is worshiped as divine","Jesus is a prophet in the Qur’an","Jesus founded the Qin Dynasty"],"why":"Judaism and Christianity differ in the understanding of Jesus.","source":"concept"},{"deck":"christianity","stem":"Which belief about Jesus is central to Christianity?","correct":"He is the Messiah and divine","wrong":["He was the first Roman emperor","He authored the Qur’an","He founded Confucianism"],"why":"Christian teaching identifies Jesus as the Messiah and divine.","source":"concept"},{"deck":"christianity","stem":"Which conditions helped early Christianity spread around the Mediterranean?","correct":"Roman roads and networks during the Pax Romana","wrong":["A complete ban on all travel","The disappearance of every city","The end of all trade and common languages"],"why":"Travel infrastructure and shared networks supported diffusion.","source":"concept"},{"deck":"christianity","stem":"What role did Constantine play in Christian history?","correct":"He supported Christianity and legalized its practice in the Roman Empire","wrong":["He founded the Persian satrapy system","He wrote the Four Noble Truths","He was the first pharaoh of Egypt"],"why":"Constantine’s policies increased imperial support for Christianity.","source":"concept"},{"deck":"islam","stem":"Which text is sacred in Islam?","correct":"Qur’an","wrong":["Avesta","Analects","Bhagavad Gita"],"why":"The Qur’an is central to Islam.","source":"concept"},{"deck":"islam","stem":"How is Jesus understood in Islam?","correct":"As a respected prophet, not divine","wrong":["As the sole author of the Torah","As a Roman senator","As the founder of Buddhism"],"why":"Islam honors Jesus as a prophet but does not consider him God.","source":"concept"},{"deck":"islam","stem":"Which helped Islam spread across regions?","correct":"Conquest and networks such as Indian Ocean and Trans-Saharan trade","wrong":["Only isolation in one desert city","No movement of merchants or travelers","The disappearance of written language"],"why":"Trade and political expansion both contributed to religious diffusion.","source":"concept"},{"deck":"hinduism","stem":"Which pair names key sacred Hindu texts?","correct":"Vedas and Bhagavad Gita","wrong":["Torah and Qur’an","Analects and Avesta","Roman law and Hammurabi’s Code"],"why":"The Vedas and Bhagavad Gita are significant in Hindu traditions.","source":"concept"},{"deck":"hinduism","stem":"Which concept refers to duty and right conduct in Hindu traditions?","correct":"Dharma","wrong":["Satrapy","Pax Romana","Cuneiform"],"why":"Dharma is an important concept in Hindu religious and ethical life.","source":"concept"},{"deck":"hinduism","stem":"Which statement about Hinduism and Buddhism is most accurate?","correct":"Both address karma and rebirth, although their teachings differ","wrong":["Both have exactly the same understanding of an eternal self","Neither refers to suffering or moral conduct","Both began as Roman imperial religions"],"why":"The traditions overlap on some ideas but do not interpret all concepts alike.","source":"concept"},{"deck":"buddhism","stem":"What do the Four Noble Truths address?","correct":"Suffering, its cause, its end, and a path to its end","wrong":["Four Persian provinces and their satraps","Four Roman emperors and their roads","Four cities in the Indus Valley"],"why":"They form an important framework for Buddhist teaching.","source":"concept"},{"deck":"buddhism","stem":"What was Ashoka’s significance for Buddhism?","correct":"He sponsored and promoted Buddhist teachings","wrong":["He wrote the Christian Bible","He founded Athenian democracy","He built the Persian Royal Road"],"why":"Ashoka’s support helped Buddhism spread and gain prominence.","source":"concept"},{"deck":"buddhism","stem":"Which route helped Buddhism move across Central and East Asia?","correct":"Silk Roads","wrong":["Only the Nile delta","The Atlantic triangle alone","The Roman Appian Way alone"],"why":"Buddhist communities and travelers used Asian exchange networks.","source":"concept"},{"deck":"confucianism","stem":"What did Confucius emphasize as a foundation of good government?","correct":"Moral example, learning, and proper relationships","wrong":["Only harsh punishment and fear","Avoiding every type of education","Military conquest as the sole duty"],"why":"Confucian teaching prioritizes ethical relationships and virtuous leadership.","source":"concept"},{"deck":"confucianism","stem":"What are the Analects?","correct":"Sayings and conversations attributed to Confucius","wrong":["An Egyptian set of tomb instructions","A Persian highway atlas","A Roman war report"],"why":"The Analects is an important text of Confucianism.","source":"concept"},{"deck":"legalism","stem":"Which approach best reflects Legalism?","correct":"Strong rules enforced through rewards and punishments","wrong":["Complete rejection of written laws","Direct democracy for every resident","Avoidance of political authority under any circumstances"],"why":"Legalists argued for a strong state and clear enforcement.","source":"concept"},{"deck":"legalism","stem":"Which dynasty is particularly linked with Legalist government?","correct":"Qin Dynasty","wrong":["Gupta Empire","New Kingdom Egypt","Minoan Crete"],"why":"Qin centralization used Legalist principles.","source":"concept"},{"deck":"daoism","stem":"Which idea is most closely connected with Daoism?","correct":"Harmony with the natural way","wrong":["Unlimited administrative punishment","Roman citizenship by election","The divine status of pharaohs"],"why":"Daoism values living in accordance with the Dao.","source":"concept"},{"deck":"daoism","stem":"Which view often contrasts Daoist ideas with Legalism?","correct":"Less forcing and interference compared with strict control","wrong":["Both have exactly the same views about rules","Daoism requires everyone to become soldiers","Legalism rejects all government"],"why":"Daoism often questions excessive regulation.","source":"concept"},{"deck":"persia","stem":"What was a Persian satrap?","correct":"A provincial governor","wrong":["A Roman gladiator","An Egyptian sculptor","A Buddhist monk"],"why":"Satraps administered Persian provinces, or satrapies.","source":"concept"},{"deck":"persia","stem":"How did the Royal Road strengthen Persia?","correct":"It aided communication and movement across the empire","wrong":["It stopped merchants from moving","It connected only two Egyptian pyramids","It replaced provincial government with city-states"],"why":"Roads supported imperial administration, trade, and messaging.","source":"concept"},{"deck":"persia","stem":"Which statement best describes Persian imperial rule?","correct":"A central monarch governed diverse provinces with regional officials","wrong":["The empire consisted only of one independent Greek city","The emperor abolished all regional officials","The state had no roads or organized communication"],"why":"Satrapies connected local administration with imperial authority.","source":"concept"},{"deck":"greece","stem":"How did Athens and Sparta differ?","correct":"Athens had direct citizen democracy; Sparta emphasized military training and oligarchic institutions","wrong":["Both had identical political structures","Sparta was ruled by Roman consuls and Athens by pharaohs","Athens had no citizens and Sparta had no soldiers"],"why":"They were independent Greek city-states with markedly different priorities.","source":"concept"},{"deck":"greece","stem":"Why did mountainous geography matter in ancient Greece?","correct":"It helped encourage politically independent city-states","wrong":["It created one large fertile river valley under one king","It erased maritime trade","It prevented any settlement along the sea"],"why":"Geography favored many separate poleis rather than one unified river kingdom.","source":"concept"},{"deck":"greece","stem":"What was a major result of Alexander’s conquests?","correct":"The spread and blending of Greek and other cultures in the Hellenistic world","wrong":["The immediate creation of the Roman Empire","The founding of the Egyptian Old Kingdom","The end of all Mediterranean cities"],"why":"Hellenistic cultures developed through movement and interaction after conquest.","source":"concept"},{"deck":"rome","stem":"What were the Punic Wars?","correct":"Wars between Rome and Carthage","wrong":["Wars between Qin and Han rulers","Wars between Athens and Babylon","Wars between Maya and Inca empires"],"why":"The Punic Wars helped Rome dominate the western Mediterranean.","source":"concept"},{"deck":"rome","stem":"What does Pax Romana describe?","correct":"A long period of relative stability across much of the Roman Empire","wrong":["The Roman conquest of the Indus Valley","The establishment of the Persian Royal Road","A Greek law code made in Sparta"],"why":"Pax Romana is associated with Roman imperial order and exchange.","source":"concept"},{"deck":"rome","stem":"Which comparison between Persia and Rome is valid?","correct":"Both used roads to support large territories","wrong":["Neither empire needed governors","Both were direct democracies everywhere","Both had exactly the same laws and titles"],"why":"Both invested in communications and administration, despite differences in government.","source":"concept"},{"deck":"indiaemp","stem":"Which emperor is associated with pillars and the promotion of Buddhism?","correct":"Ashoka","wrong":["Augustus","Pericles","Hammurabi"],"why":"Ashoka was a Mauryan ruler who spread messages through edicts and supported Buddhism.","source":"concept"},{"deck":"indiaemp","stem":"Which set of achievements is linked with Gupta-era South Asia?","correct":"Mathematics including zero and place value, plus Sanskrit literature","wrong":["Hammurabi’s Code and ziggurats","Athenian democracy and the Punic Wars","Qin Legalist punishments and oracle bones"],"why":"The curriculum highlights Gupta cultural and mathematical achievements.","source":"concept"},{"deck":"indiaemp","stem":"Which statement best compares the Mauryan and Gupta empires?","correct":"Mauryan rule is associated with Ashoka, while Gupta rule is noted for cultural and scientific advances","wrong":["Both were the same dynasty with no gap","Gupta rulers created ancient Egyptian hieroglyphics","Mauryan rulers founded the Roman Senate"],"why":"Both were major South Asian states at different times.","source":"concept"},{"deck":"qinhan","stem":"What did Qin Shi Huangdi accomplish in 221 BCE?","correct":"Unified China under the Qin Empire","wrong":["Founded the Roman Republic","Created the Persian satrapy system","Began the Egyptian Old Kingdom"],"why":"Qin Shi Huangdi became the first emperor of unified Qin China.","source":"concept"},{"deck":"qinhan","stem":"How is Han government often contrasted with Qin government?","correct":"Han statecraft drew more on Confucian learning, while Qin used strict Legalist methods","wrong":["Qin had no central rule and Han had no officials","Han abolished all roads and written records","Both dynasties were Greek democracies"],"why":"This is a broad comparison: both had strong imperial authority, but governing ideals shifted.","source":"concept"},{"deck":"qinhan","stem":"Which network connected Han China to parts of Eurasia?","correct":"Silk Roads","wrong":["Only the Nile irrigation system","The Roman Punic fleet","The Aztec causeways"],"why":"The Silk Roads linked merchants, goods, and ideas across Eurasia.","source":"concept"},{"deck":"paleo","stem":"Which term best matches this definition: Modern humans originated in Africa and populations migrated outward over time.","correct":"Out of Africa Theory","wrong":["Neolithic Revolution","Agricultural revolution","Domestication"],"why":"Out of Africa Theory: Modern humans originated in Africa and populations migrated outward over time.","source":"vocab"},{"deck":"paleo","stem":"Which term best matches this definition: The Old Stone Age; humans relied primarily on gathering, hunting, and mobile lifeways.","correct":"Paleolithic Age","wrong":["Agricultural revolution","Domestication","Fertile Crescent"],"why":"Paleolithic Age: The Old Stone Age; humans relied primarily on gathering, hunting, and mobile lifeways.","source":"vocab"},{"deck":"neo","stem":"Which term best matches this definition: The long transition toward farming and food production in multiple world regions.","correct":"Neolithic Revolution","wrong":["Nomadic","Kinship groups","Domestication of fire"],"why":"Neolithic Revolution: The long transition toward farming and food production in multiple world regions.","source":"vocab"},{"deck":"neo","stem":"Which term best matches this definition: The development and spread of agriculture and domestication.","correct":"Agricultural revolution","wrong":["Kinship groups","Domestication of fire","Egalitarian"],"why":"Agricultural revolution: The development and spread of agriculture and domestication.","source":"vocab"},{"deck":"civ","stem":"Which term best matches this definition: A complex society commonly characterized by cities, organized government, specialized labor, and cultural institutions.","correct":"Civilization","wrong":["Mesopotamia","Empire","Nile River"],"why":"Civilization: A complex society commonly characterized by cities, organized government, specialized labor, and cultural institutions.","source":"vocab"},{"deck":"civ","stem":"Which term best matches this definition: Relating to agriculture and settled farming.","correct":"Agrarian","wrong":["Empire","Nile River","Predictable flooding"],"why":"Agrarian: Relating to agriculture and settled farming.","source":"vocab"},{"deck":"meso","stem":"Which term best matches this definition: One of the two major rivers of Mesopotamia.","correct":"Tigris River","wrong":["Predictable flooding","Natural barriers","Theocracy"],"why":"Tigris River: One of the two major rivers of Mesopotamia.","source":"vocab"},{"deck":"meso","stem":"Which term best matches this definition: One of the two major rivers of Mesopotamia.","correct":"Euphrates River","wrong":["Natural barriers","Theocracy","Pharaoh"],"why":"Euphrates River: One of the two major rivers of Mesopotamia.","source":"vocab"},{"deck":"egypt","stem":"Which term best matches this definition: River whose annual flooding enriched much of ancient Egypt’s farmland.","correct":"Nile River","wrong":["Cuneiform","Ziggurat","Mesopotamia"],"why":"Nile River: River whose annual flooding enriched much of ancient Egypt’s farmland.","source":"vocab"},{"deck":"egypt","stem":"Which term best matches this definition: Regular seasonal floods that helped people anticipate planting cycles.","correct":"Predictable flooding","wrong":["Ziggurat","Mesopotamia","Empire"],"why":"Predictable flooding: Regular seasonal floods that helped people anticipate planting cycles.","source":"vocab"},{"deck":"indus","stem":"Which term best matches this definition: Major South Asian river associated with early Indus civilization.","correct":"Indus River","wrong":["Empire","Nile River","Predictable flooding"],"why":"Indus River: Major South Asian river associated with early Indus civilization.","source":"vocab"},{"deck":"indus","stem":"Which term best matches this definition: Seasonal wind patterns that bring major shifts in rainfall.","correct":"Monsoons","wrong":["Nile River","Predictable flooding","Natural barriers"],"why":"Monsoons: Seasonal wind patterns that bring major shifts in rainfall.","source":"vocab"},{"deck":"chinaearly","stem":"Which term best matches this definition: Northern Chinese river associated with early Chinese states and agriculture.","correct":"Huang He (Yellow River)","wrong":["Natural barriers","Theocracy","Pharaoh"],"why":"Huang He (Yellow River): Northern Chinese river associated with early Chinese states and agriculture.","source":"vocab"},{"deck":"chinaearly","stem":"Which term best matches this definition: Major river flowing through central China.","correct":"Yangtze River","wrong":["Theocracy","Pharaoh","Dynasty"],"why":"Yangtze River: Major river flowing through central China.","source":"vocab"},{"deck":"mesoamerica","stem":"Which term best matches this definition: Cultural and geographic region including central/southern Mexico and part of Central America.","correct":"Mesoamerica","wrong":["Dynasty","Hieroglyphics","Pyramids"],"why":"Mesoamerica: Cultural and geographic region including central/southern Mexico and part of Central America.","source":"vocab"},{"deck":"mesoamerica","stem":"Which term best matches this definition: Major crop domesticated in Mesoamerica.","correct":"Maize (corn)","wrong":["Hieroglyphics","Pyramids","Indus River"],"why":"Maize (corn): Major crop domesticated in Mesoamerica.","source":"vocab"},{"deck":"andes","stem":"Which term best matches this definition: Long mountain chain along western South America.","correct":"Andes Mountains","wrong":["Indus River","Monsoons","Harappa"],"why":"Andes Mountains: Long mountain chain along western South America.","source":"vocab"},{"deck":"andes","stem":"Which term best matches this definition: Crop domesticated in the Andes and important to Andean food production.","correct":"Potatoes","wrong":["Monsoons","Harappa","Mohenjo-Daro"],"why":"Potatoes: Crop domesticated in the Andes and important to Andean food production.","source":"vocab"},{"deck":"zoro","stem":"Which term best matches this definition: Religious tradition of ancient Iran associated with Zarathustra and moral choice.","correct":"Zoroastrianism","wrong":["Four Noble Truths","Nirvana","Eightfold Path"],"why":"Zoroastrianism: Religious tradition of ancient Iran associated with Zarathustra and moral choice.","source":"vocab"},{"deck":"zoro","stem":"Which term best matches this definition: Religious teacher traditionally associated with Zoroastrianism.","correct":"Zarathustra (Zoroaster)","wrong":["Nirvana","Eightfold Path","Ashoka"],"why":"Zarathustra (Zoroaster): Religious teacher traditionally associated with Zoroastrianism.","source":"vocab"},{"deck":"judaism","stem":"Which term best matches this definition: Belief in one God combined with moral obligations.","correct":"Ethical monotheism","wrong":["Silk Roads","Monasteries","Confucius"],"why":"Ethical monotheism: Belief in one God combined with moral obligations.","source":"vocab"},{"deck":"judaism","stem":"Which term best matches this definition: The first five books of the Hebrew Bible; central to Jewish tradition.","correct":"Torah","wrong":["Monasteries","Confucius","Analects"],"why":"Torah: The first five books of the Hebrew Bible; central to Jewish tradition.","source":"vocab"},{"deck":"christianity","stem":"Which term best matches this definition: Central figure of Christianity, regarded by Christians as the Messiah and divine.","correct":"Jesus","wrong":["Social order","Civil service examination","Merit and education"],"why":"Jesus: Central figure of Christianity, regarded by Christians as the Messiah and divine.","source":"vocab"},{"deck":"christianity","stem":"Which term best matches this definition: Christian scriptures comprising the Old and New Testaments.","correct":"Christian Bible","wrong":["Civil service examination","Merit and education","Legalism"],"why":"Christian Bible: Christian scriptures comprising the Old and New Testaments.","source":"vocab"},{"deck":"islam","stem":"Which term best matches this definition: Prophet regarded in Islam as the recipient of revelations collected in the Qur’an.","correct":"Muhammad","wrong":["Merit and education","Legalism","Obedience to authority"],"why":"Muhammad: Prophet regarded in Islam as the recipient of revelations collected in the Qur’an.","source":"vocab"},{"deck":"islam","stem":"Which term best matches this definition: Sacred text of Islam.","correct":"Qur’an","wrong":["Legalism","Obedience to authority","Qin Dynasty"],"why":"Qur’an: Sacred text of Islam.","source":"vocab"},{"deck":"hinduism","stem":"Which term best matches this definition: Duty, ethical conduct, and right living; the meaning varies across Hindu traditions.","correct":"Dharma","wrong":["Obedience to authority","Qin Dynasty","Qin Shi Huangdi"],"why":"Dharma: Duty, ethical conduct, and right living; the meaning varies across Hindu traditions.","source":"vocab"},{"deck":"hinduism","stem":"Which term best matches this definition: Rebirth in another life or form.","correct":"Reincarnation","wrong":["Qin Dynasty","Qin Shi Huangdi","Strict penalties"],"why":"Reincarnation: Rebirth in another life or form.","source":"vocab"},{"deck":"buddhism","stem":"Which term best matches this definition: Title meaning awakened one, associated with Siddhartha Gautama.","correct":"Buddha","wrong":["Harmony with nature","Wu wei","Limited interference"],"why":"Buddha: Title meaning awakened one, associated with Siddhartha Gautama.","source":"vocab"},{"deck":"buddhism","stem":"Which term best matches this definition: Teachings about suffering, its cause, its end, and the path toward its end.","correct":"Four Noble Truths","wrong":["Wu wei","Limited interference","Zoroastrianism"],"why":"Four Noble Truths: Teachings about suffering, its cause, its end, and the path toward its end.","source":"vocab"},{"deck":"confucianism","stem":"Which term best matches this definition: Chinese teacher known for ethical and political philosophy.","correct":"Confucius","wrong":["Wu wei","Limited interference","Zoroastrianism"],"why":"Confucius: Chinese teacher known for ethical and political philosophy.","source":"vocab"},{"deck":"confucianism","stem":"Which term best matches this definition: A collection of sayings and conversations attributed to Confucius and his followers.","correct":"Analects","wrong":["Limited interference","Zoroastrianism","Zarathustra (Zoroaster)"],"why":"Analects: A collection of sayings and conversations attributed to Confucius and his followers.","source":"vocab"},{"deck":"legalism","stem":"Which term best matches this definition: Chinese political philosophy emphasizing strong government, explicit laws, and enforcement.","correct":"Legalism","wrong":["Zoroastrianism","Zarathustra (Zoroaster)","Avesta"],"why":"Legalism: Chinese political philosophy emphasizing strong government, explicit laws, and enforcement.","source":"vocab"},{"deck":"legalism","stem":"Which term best matches this definition: Requirement to follow political or legal commands.","correct":"Obedience to authority","wrong":["Zoroastrianism","Zarathustra (Zoroaster)","Avesta"],"why":"Obedience to authority: Requirement to follow political or legal commands.","source":"vocab"},{"deck":"daoism","stem":"Which term best matches this definition: The Way; a foundational concept of Daoist thought.","correct":"Dao","wrong":["Zoroastrianism","Zarathustra (Zoroaster)","Avesta"],"why":"Dao: The Way; a foundational concept of Daoist thought.","source":"vocab"},{"deck":"daoism","stem":"Which term best matches this definition: Daoist ideal of living in accordance with natural patterns.","correct":"Harmony with nature","wrong":["Zoroastrianism","Zarathustra (Zoroaster)","Avesta"],"why":"Harmony with nature: Daoist ideal of living in accordance with natural patterns.","source":"vocab"},{"deck":"persia","stem":"Which term best matches this definition: Governor of a Persian imperial province.","correct":"Satrap","wrong":["Polis","Democracy","Aristocracy"],"why":"Satrap: Governor of a Persian imperial province.","source":"vocab"},{"deck":"persia","stem":"Which term best matches this definition: Province administered by a satrap in the Persian Empire.","correct":"Satrapy","wrong":["Polis","Democracy","Aristocracy"],"why":"Satrapy: Province administered by a satrap in the Persian Empire.","source":"vocab"},{"deck":"greece","stem":"Which term best matches this definition: Greek city-state, typically a city and its surrounding territory.","correct":"Polis","wrong":["Satrap","Satrapy","Royal Road"],"why":"Polis: Greek city-state, typically a city and its surrounding territory.","source":"vocab"},{"deck":"greece","stem":"Which term best matches this definition: Government in which citizens exercise political authority; Athenian participation was restricted.","correct":"Democracy","wrong":["Satrap","Satrapy","Royal Road"],"why":"Democracy: Government in which citizens exercise political authority; Athenian participation was restricted.","source":"vocab"},{"deck":"rome","stem":"Which term best matches this definition: Roman government with elected officials and institutions before imperial rule.","correct":"Roman Republic","wrong":["Satrap","Satrapy","Royal Road"],"why":"Roman Republic: Roman government with elected officials and institutions before imperial rule.","source":"vocab"},{"deck":"rome","stem":"Which term best matches this definition: Territories controlled by Roman emperors and imperial institutions.","correct":"Roman Empire","wrong":["Satrap","Satrapy","Royal Road"],"why":"Roman Empire: Territories controlled by Roman emperors and imperial institutions.","source":"vocab"},{"deck":"indiaemp","stem":"Which term best matches this definition: South Asian empire that ruled a large portion of the Indian subcontinent.","correct":"Mauryan Empire","wrong":["Satrap","Satrapy","Royal Road"],"why":"Mauryan Empire: South Asian empire that ruled a large portion of the Indian subcontinent.","source":"vocab"},{"deck":"indiaemp","stem":"Which term best matches this definition: Later South Asian dynasty associated with major cultural and scientific achievements.","correct":"Gupta Empire","wrong":["Satrap","Satrapy","Royal Road"],"why":"Gupta Empire: Later South Asian dynasty associated with major cultural and scientific achievements.","source":"vocab"},{"deck":"qinhan","stem":"Which term best matches this definition: First Qin emperor, who unified China in 221 BCE.","correct":"Qin Shi Huangdi","wrong":["Satrap","Satrapy","Royal Road"],"why":"Qin Shi Huangdi: First Qin emperor, who unified China in 221 BCE.","source":"vocab"},{"deck":"qinhan","stem":"Which term best matches this definition: Government relying on codified law, centralized authority, and harsh enforcement.","correct":"Legalist government","wrong":["Satrap","Satrapy","Royal Road"],"why":"Legalist government: Government relying on codified law, centralized authority, and harsh enforcement.","source":"vocab"},{"deck":"rome","stem":"Why did Rome and Carthage fight the First Punic War?","correct":"They competed for influence over Sicily and nearby Mediterranean sea routes.","wrong":["They disputed control of the Silk Roads across Central Asia.","They fought over access to the Indus and Ganges river valleys.","They competed for the cities along the Huang He in China."],"why":"Sicily lay between Italy and North Africa and was strategically valuable to both Mediterranean powers.","source":"concept"},{"deck":"rome","stem":"How did Hannibal bring the Second Punic War into Italy in 218 BCE?","correct":"He led an army from Iberia through southern Gaul and across the Alps.","wrong":["He led an army from Egypt across the Red Sea and Arabia.","He sailed directly from Britain into the port of Rome.","He marched from Persia through India and Central Asia."],"why":"Hannibal crossed the Alps after advancing from Carthaginian territory in Iberia; he won major battles in Italy.","source":"concept"},{"deck":"rome","stem":"Which event helped decide the Second Punic War in Rome’s favor?","correct":"Scipio Africanus defeated Hannibal at the Battle of Zama.","wrong":["Cyrus the Great defeated Sparta at the Battle of Marathon.","Alexander the Great conquered Rome after the Battle of Issus.","Qin Shi Huangdi defeated Carthage at the Battle of Cannae."],"why":"Rome defeated Hannibal in North Africa at Zama in 202 BCE.","source":"concept"},{"deck":"rome","stem":"What happened at the end of the Third Punic War in 146 BCE?","correct":"Roman forces destroyed Carthage and annexed territory in North Africa.","wrong":["Carthage defeated Rome and took over the Italian peninsula.","Rome abandoned Sicily and withdrew from the Mediterranean.","Carthage and Rome united peacefully under one elected Senate."],"why":"Rome destroyed Carthage after a siege; its victory greatly expanded Roman dominance.","source":"concept"},{"deck":"rome","stem":"Where was Carthage, Rome’s rival in the Punic Wars, located?","correct":"On the Mediterranean coast of North Africa, in present-day Tunisia.","wrong":["In the highlands of the Andes in western South America.","On the Arabian Sea coast of the Indian subcontinent.","Along the Huang He in the northern Chinese plain."],"why":"Carthage was a maritime power across the Mediterranean from Italy.","source":"concept"}],"reasoning":[{"unit":1,"q":"Why could Neolithic villages support more specialized jobs than many Paleolithic mobile groups?","options":["People immediately stopped using stone tools.","All villages had exactly the same social structure.","Farming eliminated any need to trade.","Food surpluses could support people who did not farm full time."],"answer":3,"why":"Surplus food helped support craftworkers, merchants, officials, and other specialists; it did not end tool use or exchange."},{"unit":2,"q":"Which comparison of the Nile and Mesopotamian rivers is best supported by the course material?","options":["Nile floods were usually more predictable, shaping Egyptian farming and outlook.","Both river systems flooded at exactly the same time each year.","Mesopotamia had no irrigation farming.","Neither civilization used rivers for transportation."],"answer":0,"why":"The Nile’s generally predictable flood cycle differed from the often less predictable Tigris and Euphrates floods."},{"unit":2,"q":"Why must historians be careful when comparing Indus and Egyptian political systems?","options":["The two civilizations occupied the same river valley.","The Indus script remains undeciphered, limiting direct evidence about its rulers.","Indus cities had no planned streets.","Egyptian hieroglyphs have never been deciphered."],"answer":1,"why":"Archaeology reveals Indus urban planning, but its undeciphered script makes some political claims uncertain."},{"unit":3,"q":"Which statement correctly compares Jesus in Christianity and Islam?","options":["Islam teaches Jesus was the first Roman emperor.","Neither tradition considers Jesus important.","Christianity teaches Jesus is divine; Islam honors Jesus as a prophet, not God.","Both identify Jesus as the founder of Islam."],"answer":2,"why":"The traditions share respect for Jesus but have major theological differences about his nature and role."},{"unit":3,"q":"What is one major difference between Buddhist and Christian monasteries?","options":["Only one tradition ever included nuns.","Neither type of monastery preserved teachings.","Both require belief in the exact same sacred text.","They support different religious teachings and spiritual goals."],"answer":3,"why":"Both supported learning and religious communities, but their beliefs, practices, and aims differ."},{"unit":3,"q":"How did both Christianity and Buddhism spread beyond their places of origin?","options":["Trade routes, teachers, and support from some rulers helped their expansion.","Both spread only through military conquest.","Neither developed organized religious communities.","Both were founded by Constantine."],"answer":0,"why":"Each spread through a mix of travel, teaching, institutions, and political patronage, though routes and contexts differed."},{"unit":3,"q":"Which comparison of Ashoka and Constantine is accurate?","options":["Both declared the same religion to be the only legal faith.","Both gave major political support to a religion, but they ruled different empires in different eras.","Both were founders of Buddhism.","Both ruled the same empire at the same time."],"answer":1,"why":"Ashoka supported Buddhism in the Mauryan Empire; Constantine legalized and favored Christianity in the Roman Empire."},{"unit":3,"q":"How does Confucianism differ from Legalism in its basic approach to governing?","options":["They are identical political teachings with no important differences.","Legalism was founded in ancient Rome.","Confucianism emphasizes moral example and relationships; Legalism stresses clear laws and strict enforcement.","Confucianism rejects social order, while Legalism rejects government."],"answer":2,"why":"Both seek order but give different weight to ethical example and coercive law."},{"unit":4,"q":"What is the main structural difference between the Persian Empire and classical Greek city-states?","options":["Greece had one emperor who appointed Persian satraps.","Persia consisted only of small independent city-states.","Neither developed systems of taxation or military service.","Persia governed a large empire through a king and provinces; Greek poleis had separate governments."],"answer":3,"why":"Political organization is central: satrapies under an imperial king versus separate Greek city-state governments."},{"unit":4,"q":"Why were roads important in both the Persian and Roman empires?","options":["They strengthened communication, trade, and military coordination across territory.","They entirely eliminated the need for ships.","They were only religious pilgrimage paths.","They prevented all internal rebellions."],"answer":0,"why":"Both empires relied on connected routes to manage large distances, though designs and military uses differed."},{"unit":4,"q":"What changed as Rome moved from Republic to Empire?","options":["All residents gained equal political voting rights.","One ruler gained more concentrated authority, though some republican institutions remained.","The Senate disappeared on the first day of imperial rule.","Rome stopped governing provinces."],"answer":1,"why":"Augustus centralized control while maintaining institutions such as the Senate in altered roles."},{"unit":4,"q":"Why is it inaccurate to say Qin and Han governments were identical?","options":["The Qin used popular elections for emperor.","Only Qin China had a Chinese writing system.","Both centralized rule, but Han rulers increasingly promoted Confucian learning, unlike Qin Legalist emphasis.","The Han had no emperors or government officials."],"answer":2,"why":"The Han continued many state institutions while developing different governing ideals."},{"unit":4,"q":"Why should the Mauryan and Gupta empires not be described as one continuous dynasty?","options":["They ruled entirely different continents.","The Gupta Empire existed before the Indus Valley civilization.","Ashoka was a Gupta ruler.","They ruled in different centuries with intervening political changes."],"answer":3,"why":"The Mauryan Empire ended centuries before Gupta rule; there were important intervening states."},{"unit":4,"q":"Which statement best compares the Greco-Persian and Peloponnesian wars?","options":["The first involved Greek states fighting Persia; the second largely involved Greek states fighting each other.","Both were wars between Rome and Han China.","The Peloponnesian War ended before the Persian Empire existed.","Neither involved Athens or Sparta."],"answer":0,"why":"These conflicts had different opponents and consequences for the Greek world."},{"unit":4,"q":"Which feature was shared by the Roman Empire and Han China?","options":["Neither traded beyond its borders.","Both relied on bureaucratic administration to govern extensive territories.","Both had identical religious beliefs and languages.","Both were ruled by the same dynasty."],"answer":1,"why":"Their empires differed in many ways, but administration, roads and connectivity mattered in both."},{"unit":4,"q":"Why did the Punic Wars change Rome’s position in the Mediterranean?","options":["They ended all regional trade immediately.","They let Carthage conquer Greece and Rome.","They eliminated the need for Roman armies.","They helped Rome gain territory and influence over key western Mediterranean routes."],"answer":3,"why":"Rome took Sicily after the First Punic War, defeated Hannibal in the Second, and destroyed Carthage in the Third."},{"unit":4,"q":"Which map interpretation is most historically accurate?","options":["The Roman Empire in 117 CE already existed during Hannibal’s invasion in 218 BCE.","Rome was still a republic during the Punic Wars and became an empire under emperors later.","Carthage was a colony of Qin China during the Second Punic War.","The Mauryan and Gupta empires existed at exactly the same time as Carthage."],"answer":1,"why":"Dates matter: the Punic Wars took place during the Roman Republic, centuries before the empire reached its greatest extent."}]};

function homeView(){let unitCards=Object.entries(U).map(([u,d])=>{let ts=D.topics.filter(x=>x.unit===+u),qs=ts.flatMap(x=>qDeck[x.id]);let n=countMastered(qs);return `<article class="tile">${unitPill(u)}<h3>${esc(d.name)}</h3><p>${esc(d.tag)}</p><div class="barline"><span>${ts.length} lessons</span><span>${n} / ${qs.length} review checks</span></div>${bar(n,qs.length)}<div class="actions">${btn('unit-decks','Review this unit →','mini secondary',u)}</div></article>`}).join('');return `${hero()}<section class="container content"><div class="eyebrow">YOUR STUDY HOME</div><h2 class="section-title">Choose a way to investigate history</h2><p class="section-sub">These activities cover the official History 6 lesson objectives. Each section links to the others so people, places, governments, and beliefs make sense together.</p><div class="grid four"><div class="stat"><b>4</b><span>Curriculum units</span></div><div class="stat"><b>${D.topics.length}</b><span>Lesson topics</span></div><div class="stat"><b>${D.regions.length}</b><span>Early regions on the map</span></div><div class="stat"><b>${countMastered(qbank)}/${qbank.length}</b><span>Questions mastered</span></div></div><div class="see-all"><h2 class="section-title">Follow the four-unit journey</h2></div><div class="grid two">${unitCards}</div><div class="see-all"><h2 class="section-title">Interactive study stations</h2></div><div class="grid"><article class="tile"><span class="eyebrow">01 / PLACE</span><h3>Light up a river valley</h3><p>Select a river valley or agricultural hearth, then open the civilizations connected to that region.</p>${btn('goto','Open World Map →','mini secondary','map')}</article><article class="tile"><span class="eyebrow">02 / PEOPLE & SYSTEMS</span><h3>Connect leaders and ideas</h3><p>Meet key historical figures and compare the governments, traditions, and systems they shaped.</p>${btn('goto','Explore People Cards →','mini secondary','people')}</article><article class="tile"><span class="eyebrow">03 / PRACTICE</span><h3>Build your comparison</h3><p>Sort terms into interactive Venn diagrams, study comparison charts, and test your knowledge.</p>${btn('goto','Open Comparison Studio →','mini secondary','comparisons')}</article></div><div class="see-all"><h2 class="section-title">Curriculum checklist</h2><span class="smallcaps">Tap a lesson to see its objectives</span></div><div class="grid two">${Object.entries(U).map(([u,d])=>`<section class="unit-guide"><h3>${unitPill(u)} ${esc(d.name)}</h3>${D.topics.filter(x=>x.unit===+u).map(t=>`<details class="guide-item"><summary><b>${esc(t.name)}</b> <span class="muted tiny">(${t.objectives.length} objectives)</span></summary><ul>${t.objectives.map(z=>`<li>${esc(z)}</li>`).join('')}</ul>${btn('lesson-deck','Practice this lesson →','mini ghost',t.id)}</details>`).join('')}</section>`).join('')}</div><p class="special-note">Curriculum source: BASIS History 6 (AZ/DC), Units 1–4, updated July 15, 2025. The separately labeled pre-comprehensive review/exam weeks are not treated as new content units.</p></section>`}
function project(lon,lat){return {x:(lon+180)/360*1080,y:(80-lat)/140*420}}
function line(points){return 'M'+points.map(([a,b])=>{let p=project(a,b);return p.x.toFixed(1)+','+p.y.toFixed(1)}).join(' L')}
