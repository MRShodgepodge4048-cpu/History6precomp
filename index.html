function homeView(){let unitCards=Object.entries(U).map(([u,d])=>{let ts=D.topics.filter(x=>x.unit===+u),qs=ts.flatMap(x=>qDeck[x.id]);let n=countMastered(qs);return `<article class="tile">${unitPill(u)}<h3>${esc(d.name)}</h3><p>${esc(d.tag)}</p><div class="barline"><span>${ts.length} lessons</span><span>${n} / ${qs.length} review checks</span></div>${bar(n,qs.length)}<div class="actions">${btn('unit-decks','Review this unit →','mini secondary',u)}</div></article>`}).join('');return `${hero()}<section class="container content"><div class="eyebrow">YOUR STUDY HOME</div><h2 class="section-title">Choose a way to investigate history</h2><p class="section-sub">These activities cover the official History 6 lesson objectives. Each section links to the others so people, places, governments, and beliefs make sense together.</p><div class="grid four"><div class="stat"><b>4</b><span>Curriculum units</span></div><div class="stat"><b>${D.topics.length}</b><span>Lesson topics</span></div><div class="stat"><b>${D.regions.length}</b><span>Early regions on the map</span></div><div class="stat"><b>${countMastered(qbank)}/${qbank.length}</b><span>Questions mastered</span></div></div><div class="see-all"><h2 class="section-title">Follow the four-unit journey</h2></div><div class="grid two">${unitCards}</div><div class="see-all"><h2 class="section-title">Interactive study stations</h2></div><div class="grid"><article class="tile"><span class="eyebrow">01 / PLACE</span><h3>Light up a river valley</h3><p>Select a river valley or agricultural hearth, then open the civilizations connected to that region.</p>${btn('goto','Open World Map →','mini secondary','map')}</article><article class="tile"><span class="eyebrow">02 / PEOPLE & SYSTEMS</span><h3>Connect leaders and ideas</h3><p>Meet key historical figures and compare the governments, traditions, and systems they shaped.</p>${btn('goto','Explore People Cards →','mini secondary','people')}</article><article class="tile"><span class="eyebrow">03 / PRACTICE</span><h3>Build your comparison</h3><p>Sort terms into interactive Venn diagrams, study comparison charts, and test your knowledge.</p>${btn('goto','Open Comparison Studio →','mini secondary','comparisons')}</article></div><div class="see-all"><h2 class="section-title">Curriculum checklist</h2><span class="smallcaps">Tap a lesson to see its objectives</span></div><div class="grid two">${Object.entries(U).map(([u,d])=>`<section class="unit-guide"><h3>${unitPill(u)} ${esc(d.name)}</h3>${D.topics.filter(x=>x.unit===+u).map(t=>`<details class="guide-item"><summary><b>${esc(t.name)}</b> <span class="muted tiny">(${t.objectives.length} objectives)</span></summary><ul>${t.objectives.map(z=>`<li>${esc(z)}</li>`).join('')}</ul>${btn('lesson-deck','Practice this lesson →','mini ghost',t.id)}</details>`).join('')}</section>`).join('')}</div><p class="special-note">Curriculum source: BASIS History 6 (AZ/DC), Units 1–4, updated July 15, 2025. The separately labeled pre-comprehensive review/exam weeks are not treated as new content units.</p></section>`}
function project(lon,lat){return {x:(lon+180)/360*1080,y:(80-lat)/140*420}}
function line(points){return 'M'+points.map(([a,b])=>{let p=project(a,b);return p.x.toFixed(1)+','+p.y.toFixed(1)}).join(' L')}
const rivers={meso:[[[39,38],[42,36],[44,33],[47,30]],[[42,39],[44,36],[45,33],[48,30]]],egypt:[[[32,11],[32,18],[31,24],[31,28],[31,31]]],indus:[[[75,35],[72,32],[70,30],[69,27],[68,23]]],china:[[[99,35],[104,37],[109,36],[114,36],[120,38]],[[97,32],[103,30],[110,31],[116,31],[121,31]]]};
function mapSVG(){let gr=[];for(let lat=-40;lat<=60;lat+=20){let p=project(0,lat);gr.push(`<path class="map-gridline" d="M0 ${p.y} H1080"/>`)}for(let lon=-150;lon<=180;lon+=30){let p=project(lon,0);gr.push(`<path class="map-gridline" d="M${p.x} 0 V420"/>`)}let selected=mapMode==='early'?region(selectedRegion):null;let hl='';if(selected){let p=project(selected.lon,selected.lat);let rx=selected.id==='china'?53:selected.id==='andes'?24:33,ry=selected.id==='andes'?40:23;hl=`<ellipse class="map-svg-glow" cx="${p.x}" cy="${p.y}" rx="${rx}" ry="${ry}"/>`;}
 let riverDraw=mapMode==='early'?Object.entries(rivers).map(([r,paths])=>paths.map(seq=>`<path d="${line(seq)}" stroke="${r===selectedRegion?'#a7f1ff':'#90d5dd'}" stroke-width="${r===selectedRegion?'4.8':'2.2'}" stroke-opacity="${r===selectedRegion?'1':'.45'}" fill="none" stroke-linecap="round"/>`).join('')).join(''):'';
 let earlyNote=mapMode==='migration'?`<g fill="none" stroke="#ffda8b" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#arrow)"><path d="${line([[34,1],[42,17],[51,28],[80,29],[108,31]])}"/><path d="${line([[51,28],[69,18],[105,5],[132,-12]])}"/><path d="${line([[80,29],[95,47],[137,58],[171,59]])}"/></g><circle cx="${project(34,1).x}" cy="${project(34,1).y}" r="8" fill="#ffe2a4"/>`:'';
 return `<svg viewBox="0 0 1080 420" role="img" aria-label="World outline map with interactive geographic locations overlaid"><defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ffda8b"/></marker></defs><g>${gr.join('')}</g><g class="continent">${COAST}</g><g class="map-lines">${hl}${riverDraw}${earlyNote}</g><g class="countrylabels"><text x="135" y="142">AMERICAS</text><text x="528" y="243">AFRICA</text><text x="704" y="138">ASIA</text><text x="536" y="92">EUROPE</text></g></svg>`}
function regionSide(){let r=region(selectedRegion),item=r.links[selectedSociety]||r.links[0];return `<aside class="panel map-aside"><span class="unit-pill">${r.kind==='river'?'RIVER VALLEY':'AGRICULTURAL HEARTH'}</span><h3>${esc(r.name)}</h3><p class="muted">${esc(r.overview)}</p><div class="tagline tiny">${esc(r.river)} · ${esc(r.agriculture)}</div><ul class="facts">${r.features.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="divider"></div><div class="eyebrow">CLICK A CIVILIZATION OR EMPIRE</div>${r.links.map(([name,phase,detail,topicid],i)=>`<button type="button" class="society-btn ${i===selectedSociety?'active':''}" data-action="map-society" data-id="${i}"><strong>${esc(name)}</strong><small>${esc(phase)}</small></button>`).join('')}<div class="focus-card"><div class="smallcaps">${esc(item[1])}</div><h3>${esc(item[0])}</h3><p>${esc(item[2])}</p>${btn('lesson-deck','Review related lesson →','mini secondary',item[3])}</div></aside>`}
function empireSide(){let e=empire(selectedEmpire)||D.empires[0];return `<aside class="panel map-aside"><span class="unit-pill">UNIT 4 · CLASSICAL ERA</span><h3>${esc(e.name)}</h3><p>${esc(e.desc)}</p><div class="note">Map highlights are teaching regions, not exact borders. The Mauryan and Gupta empires, and the Qin and Han dynasties, existed at different times.</div><div class="divider"></div><div class="eyebrow">OTHER CLASSICAL POWERS</div>${D.empires.map(z=>`<button type="button" class="society-btn ${z.id===e.id?'active':''}" data-action="map-empire" data-id="${esc(z.id)}"><strong>${esc(z.name)}</strong></button>`).join('')}${btn('lesson-deck','Open related review →','mini secondary',e.topic)}</aside>`}
function migrationSide(){return `<aside class="panel map-aside"><span class="unit-pill">UNIT 1 · PALEOLITHIC</span><h3>Out of Africa migrations</h3><p>Modern humans originated in Africa. Over many generations, populations migrated into Southwest Asia, Europe, eastern Asia, Australia, and eventually the Americas.</p><div class="note">The arrows show a simplified teaching model. They are not exact routes taken by every individual group; movement took place over a long period and included many pathways.</div><ul class="facts"><li>Mobile kinship groups</li><li>Gathering and hunting</li><li>Fire, tools, and environmental adaptation</li></ul>${btn('lesson-deck','Practice the Paleolithic →','mini secondary','paleo')}</aside>`}
function mapView(){let pins=mapMode==='early'?D.regions.filter(x=>mapFilter==='all'||mapFilter===x.kind):mapMode==='classical'?D.empires:[];let markers=pins.map((p,i)=>{let xy=project(p.lon,p.lat),cl=mapMode==='early'?(p.kind==='hearth'?'hearth':''):'';let chosen=mapMode==='early'?selectedRegion===p.id:selectedEmpire===p.id;return `<button class="map-dot map-index ${cl} ${chosen?'chosen':''}" type="button" style="left:${xy.x/1080*100}%;top:${xy.y/420*100}%" data-action="${mapMode==='early'?'map-region':'map-empire'}" data-id="${esc(p.id)}" title="${esc(p.name)}" aria-label="${esc(p.name)}" aria-pressed="${chosen}">${i+1}</button>`}).join('');let chooser=pins.length?`<div class="map-chooser" aria-label="Select a place on the map">${pins.map((p,i)=>{let chosen=mapMode==='early'?selectedRegion===p.id:selectedEmpire===p.id;return `<button type="button" class="map-key ${mapMode==='early'&&p.kind==='hearth'?'hearth':''} ${chosen?'selected':''}" data-action="${mapMode==='early'?'map-region':'map-empire'}" data-id="${esc(p.id)}"><b>${i+1}</b><span>${esc(p.name)}</span></button>`}).join('')}</div>`:'';return `${title('PLACE · LOCATE & CONNECT','The World Map','Select a river valley or agricultural hearth to illuminate its region and see the civilizations and later empires linked to it. Switch to the classical map to compare Unit 4 powers.')}<div class="subtabs">${[['early','River valleys & hearths'],['classical','Classical empires'],['migration','Out of Africa migrations']].map(([id,t])=>`<button data-action="map-mode" data-id="${id}" class="${mapMode===id?'selected':''}">${esc(t)}</button>`).join('')}</div>${mapMode==='early'?`<div class="filters"><span class="muted tiny">Highlight:</span>${[['all','All six regions'],['river','River valleys'],['hearth','Agricultural hearths']].map(([id,t])=>btn('map-filter',t,'mini '+(mapFilter===id?'':'ghost'),id)).join('')}</div>`:''}<div class="map-wrap"><div><div class="mapstage">${mapSVG()}${markers}</div>${chooser}<div class="map-legend">${mapMode==='early'?`<span><i class="legend-dot"></i>River-valley region</span><span><i class="legend-dot green"></i>Agricultural hearth</span><span>Blue lines: principal rivers (schematic)</span>`:mapMode==='classical'?'Select a name to highlight a classical power; markers indicate centers, not territorial borders.':'Dashed arrows indicate broad movements over many generations.'}</div><div class="note" style="margin-top:22px">${mapMode==='early'?'The curriculum identifies six regions. Four are major river-valley examples; Mesoamerica and the Andes are mapped as agricultural hearths. Some early river regions were also centers of farming.':'Click a map marker or use the list to explore the historical connections.'}</div></div>${mapMode==='early'?regionSide():mapMode==='classical'?empireSide():migrationSide()}</div>`}
function peopleView(){let cards=D.people.filter(x=>chosenUnit==='all'||x.unit===+chosenUnit).map(p=>{let exp=personOpen===p.id;return `<article class="card" data-searchable="${esc((p.name+' '+p.where+' '+p.role).toLowerCase())}"><div class="top"><div class="monogram">${esc(p.name[0])}</div>${unitPill(p.unit)}</div><h3>${esc(p.name)}</h3><p class="tiny tagline">${esc(p.where)} · ${esc(p.when)}</p><p>${esc(p.role)}</p>${exp?`<div class="details"><b>Why this person matters</b><p>${esc(p.impact)}</p><p class="tiny muted">Related lessons: ${p.related.map(id=>esc(topic(id)?.name||id)).join(' · ')}</p>${p.related.map(id=>btn('lesson-deck','Review '+esc(topic(id)?.name),'mini ghost',id)).join(' ')}</div>`:''}<footer>${btn('person-open',exp?'Close card ↑':'Explore this person →','mini secondary',p.id)}</footer></article>`}).join('');return `${title('PEOPLE · IDEAS & DECISIONS','People Cards','Discover the people behind laws, religions, empires, scientific advances, and historical change. Click each card for the explanation and related lesson.')}${searchFilter('person')}<div class="grid" id="search-grid">${cards}</div>`}
function systemsView(){let cards=D.systems.filter(x=>chosenUnit==='all'||x.unit===+chosenUnit).map(s=>{let exp=systemOpen===s.id;return `<article class="card" data-searchable="${esc((s.name+' '+s.kind+' '+s.summary).toLowerCase())}"><div class="top"><span class="unit-pill">${esc(s.kind)}</span>${unitPill(s.unit)}</div><h3>${esc(s.name)}</h3><p>${esc(s.summary)}</p>${exp?`<div class="details"><b>Historical example</b><p>${esc(s.example)}</p><p class="tiny muted">Related lessons: ${s.related.map(id=>esc(topic(id)?.name||id)).join(' · ')}</p>${s.related.map(id=>btn('lesson-deck','Review '+esc(topic(id)?.name),'mini ghost',id)).join(' ')}</div>`:''}<footer>${btn('system-open',exp?'Close explanation ↑':'See example →','mini secondary',s.id)}</footer></article>`}).join('');return `${title('SYSTEMS · LAW · GOVERNMENT · BELIEF','Policy Cards','Compare the systems that organized societies: farming, social hierarchy, laws, philosophies, governments, and imperial institutions. Click to see each in context.')}${searchFilter('system')}<div class="grid" id="search-grid">${cards}</div>`}
function searchFilter(which){return `<div class="filters" style="margin-bottom:22px"><label for="unit-filter" class="smallcaps">Unit</label><select id="unit-filter" class="field" aria-label="Filter by curriculum unit"><option value="all" ${chosenUnit==='all'?'selected':''}>All units</option>${Object.entries(U).map(([u,x])=>`<option value="${u}" ${chosenUnit===u?'selected':''}>Unit ${u}: ${esc(x.name)}</option>`).join('')}</select><label for="search-cards" class="smallcaps">Search</label><input id="search-cards" class="field" placeholder="Search ${which==='person'?'names or places':'systems or concepts'}…" autocomplete="off"></div><div class="special-note" style="margin-bottom:14px">The people and systems shown are tied to curriculum topics. Some named figures supply context for required comparisons.</div>`}
function decksView(){if(deckOpened){let d=topic(deckOpened),qs=qDeck[d.id]||[],q=qs[questionIndex]||qs[0];if(!q)return '<p>No questions are available for this lesson.</p>';let completed=countMastered(qs),right=answerIndex===q.answer,wrong=answerIndex!==null&&!right;return `<div class="quiz"><div class="crumb">${btn('decks-back','← Review Decks','mini ghost')} &nbsp; / &nbsp; Unit ${d.unit} / ${esc(d.name)}</div><div class="eyebrow">CURRICULUM PRACTICE · UNIT ${d.unit}</div><h1 class="section-title">${esc(d.name)}</h1><p class="muted">${esc(d.summary)}</p><div class="panel"><div class="barline"><span>${completed} of ${qs.length} mastered</span><span>Question ${questionIndex+1}/${qs.length}</span></div>${bar(completed,qs.length)}<div class="quiz-numbers">${qs.map((z,i)=>`<button type="button" data-action="question-jump" data-id="${i}" class="${mastery.has(z.id)?'done':''} ${questionIndex===i?'now':''}" aria-label="Question ${i+1}">${i+1}</button>`).join('')}</div><span class="unit-pill">${q.source==='vocab'?'VOCABULARY CHECK':'CONCEPT CHECK'}</span><h3>${esc(q.stem)}</h3>${q.options.map((choice,i)=>`<button type="button" class="choice ${answerIndex===i?(right?'correct':'incorrect'):''} ${right&&i===q.answer?'correct':''}" data-action="quiz-answer" data-id="${i}" ${right?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(choice)}</span></button>`).join('')}${answerIndex!==null?`<div role="status" class="feedback ${wrong?'bad':''}">${right?`<b>✓ Correct!</b> ${esc(q.why)}`:'<b>Not quite.</b> Try another answer. Think about the historical evidence and the lesson topic.'}</div>`:''}<div class="actions">${btn('question-next',questionIndex===qs.length-1?'Finish deck →':'Next question →','secondary','',)}${btn('decks-back','Back to decks','mini ghost')}</div></div><div class="note" style="margin-top:16px"><b>Lesson targets:</b> ${d.objectives.map(esc).join(' · ')}</div></div>`}
 let filtered=D.topics.filter(t=>chosenUnit==='all'||t.unit===+chosenUnit);let tot=filtered.flatMap(t=>qDeck[t.id]);return `${title('QUESTION BANK · RETRIEVAL PRACTICE','Review Decks','Choose a lesson. Check your knowledge of the exact ideas, vocabulary, people, places, and comparisons in Units 1–4. Incorrect answers can be retried; mastered questions are saved on this device.')}
 ${searchFilter('lesson')}<div class="barline"><strong>${countMastered(tot)} / ${tot.length} mastered in this view</strong><span>${filtered.length} lessons</span></div>${bar(countMastered(tot),tot.length)}<div class="grid two" style="margin-top:22px" id="search-grid">${filtered.map(t=>{let qs=qDeck[t.id],done=countMastered(qs);return `<article class="tile" data-searchable="${esc((t.name+' '+t.summary+' '+t.subtitle).toLowerCase())}">${unitPill(t.unit)}<h3>${esc(t.name)}</h3><p>${esc(t.summary)}</p><div class="barline"><span>${done} mastered</span><span>${qs.length} questions</span></div>${bar(done,qs.length)}<div class="actions">${btn('lesson-deck','Open lesson deck →','mini secondary',t.id)}</div></article>`}).join('')}</div><p class="special-note">The practice bank includes concept questions and extra vocabulary checks. It does not replace class notes or your teacher’s assessments.</p>`}

function reasoningView(){const q=D.reasoning[reasoningIndex],chosen=reasoningChoice,correct=chosen===q.answer;
return `<div class="panel compare-reason"><div class="eyebrow">HISTORICAL REASONING · ${reasoningIndex+1} OF ${D.reasoning.length}</div>
<h2 class="section-title">Compare &amp; explain</h2><p class="muted">Choose the strongest comparison. Then read the evidence-based explanation.</p>
<div class="filters"><span class="tagline tiny">Unit ${q.unit} · Question ${reasoningIndex+1} of ${D.reasoning.length}</span></div>
<h3>${esc(q.q)}</h3><div class="reason-answers">${q.options.map((o,i)=>`<button type="button" data-action="reason-answer" data-id="${i}" class="reason-answer ${chosen!==null&&i===q.answer?'reason-right':''} ${chosen===i&&i!==q.answer?'reason-wrong':''}" ${chosen!==null?'disabled':''}><b>${'ABCD'[i]}.</b> ${esc(o)}</button>`).join('')}</div>
${chosen!==null?`<div class="reason-feedback" role="status"><strong>${correct?'Correct!':'Review this comparison.'}</strong><p>${esc(q.why)}</p></div>`:''}
<div class="actions"><button type="button" class="mini ghost" data-action="reason-prev" ${reasoningIndex===0?'disabled':''}>← Previous</button><button type="button" class="mini" data-action="reason-next" ${chosen===null||reasoningIndex===D.reasoning.length-1?'disabled':''}>Next question →</button><button type="button" class="mini ghost" data-action="reason-restart">Start over</button></div></div>`;
}
function compareView(){let c=comp(compareId),places=sortRecords[c.id]||{};let count=Object.keys(places).length;let score=c.items.filter((x,i)=>places[i]===x.zone).length;
 const zone=(z,label)=>`<div role="button" tabindex="0" data-drop="${z}" data-action="sort-place" data-id="${z}" class="compare-zone ${z==='both'?'shared':''}" aria-label="Place selected term in ${esc(label)}"><h3>${esc(label)}</h3>${c.items.map((t,i)=>places[i]===z?`<button draggable="true" class="sort-chip" data-drag="${i}" data-action="sort-return" data-id="${i}" title="Click to return term to bank">${esc(t.text)} ${checkCompare?`<span class="${t.zone===z?'correct-mark':'wrong-mark'}">${t.zone===z?'✓':'✗'}</span>`:''}</button>`:'').join('')}<small>Drop here or select a term, then click here</small></div>`;
 return `${title('CONNECT THE EVIDENCE','Comparison Studio','Sort historical terms, compare side-by-side evidence, and answer reasoning questions. Definitions and feedback are available throughout.')}
 <div class="subtabs"><button class="${comparisonTab==='sort'?'selected':''}" data-action="comp-tab" data-id="sort">Drag-and-drop diagrams</button><button class="${comparisonTab==='chart'?'selected':''}" data-action="comp-tab" data-id="chart">Comparison charts</button><button class="${comparisonTab==='reason'?'selected':''}" data-action="comp-tab" data-id="reason">Compare &amp; explain</button></div>${comparisonTab==='reason'?reasoningView():comparisonTab==='chart'?`<div class="chart-selector">${D.charts.map((x,i)=>btn('chart-open',esc(x.title),'mini '+(chartIndex===i?'':'ghost'),i)).join('')}</div><div class="panel"><h2 class="section-title">${esc(D.charts[chartIndex].title)}</h2><div class="chart-box"><table class="comparison-chart"><thead><tr>${D.charts[chartIndex].head.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${D.charts[chartIndex].rows.map(row=>`<tr>${row.map((cell,i)=>`<td>${i===0?'<b>':''}${esc(cell)}${i===0?'</b>':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`:
 `<div class="filters"><label for="compare-select" class="smallcaps">Comparison:</label><select class="field" id="compare-select">${D.comparisons.map(x=>`<option value="${x.id}" ${x.id===compareId?'selected':''}>${esc(x.name)}</option>`).join('')}</select><span class="tagline tiny">${count} of ${c.items.length} placed</span></div><div class="compare-bank"><div class="eyebrow">UNSORTED TERMS</div><p class="muted tiny">Drag the term, or click its name then choose the correct section. Click “Definition” when you need help.</p><div class="compare-terms" data-drop="bank">${c.items.map((t,i)=>places[i]===undefined?`<div draggable="true" data-drag="${i}" class="sort-term ${selectedTerm===i?'chosen':''}"><button type="button" data-action="sort-select" data-id="${i}" aria-pressed="${selectedTerm===i}">${esc(t.text)}</button><button type="button" class="definition-btn" data-action="sort-define" data-id="${i}">Definition</button></div>`:'').join('')||'<p class="muted">All terms placed! Click any term in a section to return it to the bank.</p>'}</div></div>${termInfo!==null?`<div class="term-definition"><b>${esc(c.items[termInfo].text)}</b> — ${esc(c.items[termInfo].defn)}</div>`:''}<div class="compare-grid">${zone('a',c.a+' only')}${zone('both','Both')}${zone('b',c.b+' only')}</div><div class="actions">${btn('sort-check','Check answers','', '')}${btn('sort-reset','Reset this diagram','mini ghost')}</div>${checkCompare?`<div role="status" class="focus-card"><div class="score">${score} / ${c.items.length} correct</div><p>Green checks are correct; red X marks need another attempt. Click a misplaced term to return it to the bank, then sort it again.</p></div>`:''}<p class="special-note">Results for each diagram are saved in this browser. Shared concepts belong in the middle “Both” section.</p>`}`}
function render(){renderNav();document.getElementById('main').innerHTML=screen==='home'?homeView():`<section class="container content">${screen==='map'?mapView():screen==='people'?peopleView():screen==='systems'?systemsView():screen==='decks'?decksView():screen==='comparisons'?compareView():''}</section>`}
function action(act,id){if(act==='goto'){navigate(id);return}if(act==='unit-decks'){chosenUnit=id;navigate('decks');return}if(act==='lesson-deck'){deckOpened=id;questionIndex=0;answerIndex=null;wrongIndex=null;screen='decks';render();window.scrollTo({top:0,behavior:'instant'});return}
 if(act==='map-mode'){mapMode=id;mapFilter='all';render();return}if(act==='map-filter'){mapFilter=id;if(mapFilter!=='all'&&region(selectedRegion).kind!==mapFilter){selectedRegion=D.regions.find(x=>x.kind===mapFilter).id;selectedSociety=0}render();return}if(act==='map-region'){selectedRegion=id;selectedSociety=0;render();return}if(act==='map-society'){selectedSociety=+id;render();return}if(act==='map-empire'){selectedEmpire=id;render();return}
 if(act==='person-open'){personOpen=personOpen===id?'':id;render();return}if(act==='system-open'){systemOpen=systemOpen===id?'':id;render();return}if(act==='decks-back'){deckOpened='';answerIndex=null;render();return}if(act==='question-jump'){questionIndex=+id;answerIndex=null;wrongIndex=null;render();return}if(act==='quiz-answer'){let q=qDeck[deckOpened][questionIndex];answerIndex=+id;if(answerIndex===q.answer){mastery.add(q.id);progressSave()}render();return}if(act==='question-next'){let qs=qDeck[deckOpened];if(questionIndex<qs.length-1){questionIndex++;answerIndex=null;wrongIndex=null}else{deckOpened='';answerIndex=null}render();return}
 if(act==='reason-answer'){reasoningChoice=+id;render();return}if(act==='reason-next'){reasoningIndex=Math.min(D.reasoning.length-1,reasoningIndex+1);reasoningChoice=null;render();return}if(act==='reason-prev'){reasoningIndex=Math.max(0,reasoningIndex-1);reasoningChoice=null;render();return}if(act==='reason-restart'){reasoningIndex=0;reasoningChoice=null;render();return}if(act==='comp-tab'){comparisonTab=id;render();return}if(act==='chart-open'){chartIndex=+id;render();return}if(act==='sort-select'){let i=+id;selectedTerm=selectedTerm===i?null:i;render();return}if(act==='sort-define'){termInfo=+id;render();return}if(act==='sort-place'){if(selectedTerm!==null){placeTerm(selectedTerm,id)}return}if(act==='sort-return'){let p=sortRecords[compareId]||{};delete p[id];sortRecords[compareId]=p;checkCompare=false;sortSave();render();return}if(act==='sort-check'){checkCompare=true;render();return}if(act==='sort-reset'){sortRecords[compareId]={};selectedTerm=null;checkCompare=false;termInfo=null;sortSave();render();return}
}
function placeTerm(i,zone){if(zone==='bank'){let p=sortRecords[compareId]||{};delete p[i];sortRecords[compareId]=p}else{let p=sortRecords[compareId]||{};p[i]=zone;sortRecords[compareId]=p}selectedTerm=null;checkCompare=false;termInfo=null;sortSave();render()}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const el=e.target.closest('[data-action]');if(!el)return;action(el.dataset.action,el.dataset.id||'')});
document.addEventListener('change',e=>{if(e.target.id==='unit-filter'){chosenUnit=e.target.value;render()}if(e.target.id==='compare-select'){compareId=e.target.value;selectedTerm=null;termInfo=null;checkCompare=false;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search-cards'){let search=e.target.value.toLowerCase().trim();document.querySelectorAll('[data-searchable]').forEach(el=>{el.style.display=el.dataset.searchable.includes(search)?'':'none'})}});
let dragged=null;
document.addEventListener('dragstart',e=>{let el=e.target.closest('[data-drag]');if(!el)return;dragged=+el.dataset.drag;if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragged))}});
document.addEventListener('dragover',e=>{let el=e.target.closest('[data-drop]');if(el){e.preventDefault();el.classList.add('over')}});
document.addEventListener('dragleave',e=>{let el=e.target.closest('[data-drop]');if(el)el.classList.remove('over')});
document.addEventListener('drop',e=>{let el=e.target.closest('[data-drop]');if(!el||dragged===null||screen!=='comparisons')return;e.preventDefault();e.stopPropagation();let z=el.dataset.drop;let i=dragged;dragged=null;placeTerm(i,z)});
document.addEventListener('dragend',e=>{dragged=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
document.addEventListener('keydown',e=>{let el=e.target.closest('.compare-zone');if(el&&(e.key==='Enter'||e.key===' ')&&selectedTerm!==null){e.preventDefault();placeTerm(selectedTerm,el.dataset.drop)}});
render();
</script></body></html>
