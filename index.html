const empirePalette={persia:['#aa92e5','#eee2ff'],greece:['#e9be61','#fff1c6'],alexander:['#8bc5c8','#d7fbff'],romanrepublic:['#ed9a77','#ffe2d5'],carthage:['#b1a1f2','#eeebff'],rome:['#f49b84','#ffe5da'],maurya:['#afd78b','#e3f8ce'],gupta:['#dfb4df','#ffeaff'],qin:['#8bc6d9','#d9f5ff'],han:['#81bcaa','#e4fff4']};
function selectedEmpireShapes(){if(mapMode!=='classical')return '';let item=empire(selectedEmpire),paths=territoryShapes[selectedEmpire]||[];let pal=empirePalette[selectedEmpire]||['#d5bc79','#ffefa9'];return `<g class="empire-footprints" role="img" aria-label="Approximate historical territory: ${esc(item?.name||'')}">${paths.map(pts=>`<path d="${line(pts)} Z" fill="${pal[0]}" fill-opacity=".52" stroke="${pal[1]}" stroke-width="2.2" stroke-linejoin="round"/>`).join('')}</g>`}
function mapSVG(){let gr=[];for(let lat=-40;lat<=60;lat+=20){let p=project(0,lat);gr.push(`<path class="map-gridline" d="M0 ${p.y} H1080"/>`)}for(let lon=-150;lon<=180;lon+=30){let p=project(lon,0);gr.push(`<path class="map-gridline" d="M${p.x} 0 V420"/>`)}let selected=mapMode==='early'?region(selectedRegion):null;let hl='';if(selected){let p=project(selected.lon,selected.lat);let rx=selected.id==='china'?53:selected.id==='andes'?24:33,ry=selected.id==='andes'?40:23;hl=`<ellipse class="map-svg-glow" cx="${p.x}" cy="${p.y}" rx="${rx}" ry="${ry}"/>`;}
 let riverDraw=mapMode==='early'?Object.entries(rivers).map(([r,paths])=>paths.map(seq=>`<path d="${line(seq)}" stroke="${r===selectedRegion?'#a7f1ff':'#90d5dd'}" stroke-width="${r===selectedRegion?'4.8':'2.2'}" stroke-opacity="${r===selectedRegion?'1':'.45'}" fill="none" stroke-linecap="round"/>`).join('')).join(''):'';
 let migrationRoutes=mapMode==='migration'?[
   {points:[[32,1],[31,13],[32,24],[34,29],[37,31],[43,31]],label:'Africa → Southwest Asia'},
   {points:[[43,31],[39,36],[33,40],[24,44],[15,46],[3,50]],label:'Southwest Asia → Europe'},
   {points:[[43,31],[54,29],[67,26],[79,25],[92,22],[102,16],[109,8],[118,1],[128,-6],[138,-12],[146,-22]],label:'Asia → Sahul (Australia/New Guinea)'},
   {points:[[67,26],[79,37],[95,43],[115,51],[139,56],[158,62],[179,64]],label:'Asia → northeastern Asia'},
   {points:[[-179,64],[-167,62],[-151,58],[-139,52],[-128,46],[-118,38],[-106,29],[-91,19]],label:'Beringia → North America'},
   {points:[[-91,19],[-84,11],[-78,3],[-77,-9],[-72,-23],[-71,-36]],label:'North America → South America'}
 ]:[];
 let migrationDraw=migrationRoutes.map(z=>`<path d="${line(z.points)}" fill="none" stroke="#ffdc9e" stroke-width="3.5" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"><title>${z.label}</title></path>`).join('')+(mapMode==='migration'?`<circle cx="${project(32,1).x}" cy="${project(32,1).y}" r="8.5" fill="#ffe2a4" stroke="#684719" stroke-width="2"><title>Illustrative starting area in Africa; not an exact origin point</title></circle><text class="migration-label" x="${project(-153,68).x}" y="${project(-153,68).y}">BERINGIA</text><text class="migration-label" x="${project(16,-5).x}" y="${project(16,-5).y}">AFRICAN ORIGINS</text>`:'');
 return `<svg viewBox="0 0 1080 420" role="img" aria-label="Illustrative world map with highlighted river valleys, one selected ancient power, or Out of Africa migration routes"><defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#ffda8b"/></marker></defs><g>${gr.join('')}</g><g class="continent">${COAST}</g><g class="map-lines">${selectedEmpireShapes()}${hl}${riverDraw}${migrationDraw}</g><g class="countrylabels"><text x="135" y="142">AMERICAS</text><text x="528" y="243">AFRICA</text><text x="704" y="138">ASIA</text><text x="536" y="92">EUROPE</text></g></svg>`}
const detailedBounds={
 persia:[20,78,17,50],greece:[12,39,30,50],alexander:[15,79,15,51],
 romanrepublic:[-8,26,29,52],carthage:[-15,20,26,50],rome:[-16,49,14,64],
 maurya:[59,99,5,44],gupta:[63,99,11,40],qin:[94,128,19,48],han:[77,130,13,55]
};
function focusedEmpireMap(){if(mapMode!=='classical')return '';let e=empire(selectedEmpire);if(!e)return '';let [west,east,south,north]=detailedBounds[e.id]||[e.lon-25,e.lon+25,e.lat-20,e.lat+20];let nw=project(west,north),se=project(east,south),w=se.x-nw.x,h=se.y-nw.y,pt=project(e.lon,e.lat),r=Math.max(.7,w*.012);let label=(e.id==='carthage'?'Carthage':e.id==='romanrepublic'?'Rome':e.id==='rome'?'Rome':e.id==='greece'?'Athens / Greek core':e.id==='alexander'?'Alexander’s Empire':e.id==='persia'?'Persia':e.id==='maurya'?'Mauryan India':e.id==='gupta'?'Gupta India':e.id==='qin'?'Qin China':'Han China');return `<div class="focused-map"><div class="focused-heading"><strong>Close-up: ${esc(e.name)}</strong><span>Approximate historical extent</span></div><svg viewBox="${nw.x} ${nw.y} ${w} ${h}" role="img" aria-label="Close-up geographical map showing the approximate extent of ${esc(e.name)}"><rect x="${nw.x}" y="${nw.y}" width="${w}" height="${h}" fill="#164556"/><g class="continent">${COAST}</g>${selectedEmpireShapes()}<circle cx="${pt.x}" cy="${pt.y}" r="${r}" fill="#ffedb6" stroke="#172e35" stroke-width="${r*.27}"><title>${esc(label)}: approximate central location</title></circle></svg><p class="tiny muted">The close-up makes the selected territory easier to see. Shapes are schematic and specific to the date shown in the name, not precise borders.</p></div>`}
function regionSide(){let r=region(selectedRegion),item=r.links[selectedSociety]||r.links[0];return `<aside class="panel map-aside"><span class="unit-pill">${r.kind==='river'?'RIVER VALLEY':'AGRICULTURAL HEARTH'}</span><h3>${esc(r.name)}</h3><p class="muted">${esc(r.overview)}</p><div class="tagline tiny">${esc(r.river)} · ${esc(r.agriculture)}</div><ul class="facts">${r.features.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="divider"></div><div class="eyebrow">CLICK A CIVILIZATION OR EMPIRE</div>${r.links.map(([name,phase,detail,topicid],i)=>`<button type="button" class="society-btn ${i===selectedSociety?'active':''}" data-action="map-society" data-id="${i}"><strong>${esc(name)}</strong><small>${esc(phase)}</small></button>`).join('')}<div class="focus-card"><div class="smallcaps">${esc(item[1])}</div><h3>${esc(item[0])}</h3><p>${esc(item[2])}</p>${btn('lesson-deck','Review related lesson →','mini secondary',item[3])}</div></aside>`}
function empireSide(){let e=empire(selectedEmpire)||D.empires[0];let isPunic=['rome','romanrepublic','carthage'].includes(e.id);let note=e.id==='greece'?'Independent Greek city-states were not a single country. The shaded area shows a concentration of Greek poleis.':`This shaded footprint is approximate for ${esc(e.name)}. It is not an exact border or a claim that all the empires existed simultaneously.`;
 let punic=isPunic?`<section class="punic-lesson"><h3>The Punic Wars: Rome &amp; Carthage</h3><p>Rome was still a <b>republic</b> when it fought Carthage. The wars helped it gain control of the western Mediterranean.</p><ol class="facts"><li><b>First (264–241 BCE):</b> mainly over Sicily; Rome won.</li><li><b>Second (218–201 BCE):</b> Hannibal crossed the Alps into Italy; Rome ultimately defeated him at Zama in 202 BCE.</li><li><b>Third (149–146 BCE):</b> Rome destroyed Carthage.</li></ol><p class="tiny muted">Choose one power below to see its territory <b>at the beginning of the Second Punic War</b> (218 BCE).</p><div class="actions">${btn('map-empire','Show Roman Republic','mini secondary','romanrepublic')}${btn('map-empire','Show Carthage','mini secondary','carthage')}</div><div class="actions">${btn('map-punic-compare','Compare Rome & Carthage →','mini ghost')}</div><p class="tiny muted">This is a time-specific comparison. The Roman Empire outline shows a much later period, c. 117 CE.</p></section>`:'';
 return `<aside class="panel map-aside"><span class="unit-pill">UNIT 4 · CLASSICAL ERA</span><h3>${esc(e.name)}</h3><p>${esc(e.desc)}</p><div class="note">${note}</div>${punic}<div class="divider"></div><div class="eyebrow">SELECT ONE CLASSICAL POWER</div>${D.empires.map(z=>`<button type="button" class="society-btn ${z.id===e.id?'active':''}" data-action="map-empire" data-id="${esc(z.id)}" aria-pressed="${z.id===e.id}"><strong>${esc(z.name)}</strong></button>`).join('')}${btn('lesson-deck','Open related review →','mini secondary',e.topic)}</aside>`}
function migrationSide(){return `<aside class="panel map-aside"><span class="unit-pill">UNIT 1 · PALEOLITHIC</span><h3>Out of Africa migrations</h3><p><em>Homo sapiens</em> evolved in Africa, and populations spread beyond Africa over many thousands of years.</p><div class="note"><b>Follow the arrows:</b> movement into Southwest Asia; different branches into Europe and Asia; migration through island Southeast Asia to the connected Australia–New Guinea landmass (Sahul); and later movement from northeastern Asia through Beringia into the Americas.</div><p class="muted tiny">These routes are broad, simplified teaching models, not a single journey by one group. Their exact timings and pathways remain topics of research. The map separates the Asia–Beringia and Beringia–Americas arrows to cross the map edge correctly.</p><ul class="facts"><li>Origins of our species in Africa</li><li>Mobile gathering and hunting groups</li><li>Adaptation to many environments</li></ul>${btn('lesson-deck','Practice the Paleolithic →','mini secondary','paleo')}</aside>`}
function mapView(){let pins=mapMode==='early'?D.regions.filter(x=>mapFilter==='all'||mapFilter===x.kind):mapMode==='classical'?D.empires:[];let markers=pins.map((p,i)=>{let xy=project(p.lon,p.lat),cl=mapMode==='early'?(p.kind==='hearth'?'hearth':''):'';let chosen=mapMode==='early'?selectedRegion===p.id:selectedEmpire===p.id;return `<button class="map-dot map-index ${cl} ${chosen?'chosen':''}" type="button" style="left:${xy.x/1080*100}%;top:${xy.y/420*100}%" data-action="${mapMode==='early'?'map-region':'map-empire'}" data-id="${esc(p.id)}" title="${esc(p.name)}" aria-label="${esc(p.name)}" aria-pressed="${chosen}">${i+1}</button>`}).join('');let chooser=pins.length?`<div class="map-chooser" aria-label="Select a place on the map">${pins.map((p,i)=>{let chosen=mapMode==='early'?selectedRegion===p.id:selectedEmpire===p.id;return `<button type="button" class="map-key ${mapMode==='early'&&p.kind==='hearth'?'hearth':''} ${chosen?'selected':''}" data-action="${mapMode==='early'?'map-region':'map-empire'}" data-id="${esc(p.id)}"><b>${i+1}</b><span>${esc(p.name)}</span></button>`}).join('')}</div>`:'';return `${title('PLACE · LOCATE & CONNECT','The World Map','Light up early river valleys and agricultural hearths, or select one dated classical power to see its approximate territory. Use the migration view to trace the spread of modern humans.')}<div class="subtabs">${[['early','River valleys & hearths'],['classical','Classical empires'],['migration','Out of Africa migrations']].map(([id,t])=>`<button data-action="map-mode" data-id="${id}" class="${mapMode===id?'selected':''}">${esc(t)}</button>`).join('')}</div>${mapMode==='early'?`<div class="filters"><span class="muted tiny">Highlight:</span>${[['all','All six regions'],['river','River valleys'],['hearth','Agricultural hearths']].map(([id,t])=>btn('map-filter',t,'mini '+(mapFilter===id?'':'ghost'),id)).join('')}</div>`:''}<div class="map-wrap"><div><div class="mapstage">${mapSVG()}${markers}</div>${focusedEmpireMap()}${chooser}<div class="map-legend">${mapMode==='early'?`<span><i class="legend-dot"></i>River-valley region</span><span><i class="legend-dot green"></i>Agricultural hearth</span><span>Blue lines: principal rivers (schematic)</span>`:mapMode==='classical'?'One time-specific civilization or empire shaded at a time. Areas are approximate historical footprints.':'Dashed routes show an illustrative, multi-stage movement; the map is not a claim of a single exact route.'}</div><div class="note" style="margin-top:22px">${mapMode==='early'?'The curriculum identifies six regions. Four are major river-valley examples; Mesoamerica and the Andes are mapped as agricultural hearths. Some early river regions were also centers of farming.':'Click a map marker or use the list to explore the historical connections.'}</div></div>${mapMode==='early'?regionSide():mapMode==='classical'?empireSide():migrationSide()}</div>`}
function peopleView(){let cards=D.people.filter(x=>chosenUnit==='all'||x.unit===+chosenUnit).map(p=>{let exp=personOpen===p.id;return `<article class="card" data-searchable="${esc((p.name+' '+p.where+' '+p.role).toLowerCase())}"><div class="top"><div class="monogram">${esc(p.name[0])}</div>${unitPill(p.unit)}</div><h3>${esc(p.name)}</h3><p class="tiny tagline">${esc(p.where)} · ${esc(p.when)}</p><p>${esc(p.role)}</p>${exp?`<div class="details"><b>Why this person matters</b><p>${esc(p.impact)}</p><p class="tiny muted">Related lessons: ${p.related.map(id=>esc(topic(id)?.name||id)).join(' · ')}</p>${p.related.map(id=>btn('lesson-deck','Review '+esc(topic(id)?.name),'mini ghost',id)).join(' ')}</div>`:''}<footer>${btn('person-open',exp?'Close card ↑':'Explore this person →','mini secondary',p.id)}</footer></article>`}).join('');return `${title('PEOPLE · IDEAS & DECISIONS','People Cards','Discover the people behind laws, religions, empires, scientific advances, and historical change. Click each card for the explanation and related lesson.')}${searchFilter('person')}<div class="grid" id="search-grid">${cards}</div>`}

 if(act==='reason-answer'){reasoningChoice=+id;render();return}if(act==='reason-next'){reasoningIndex=Math.min(D.reasoning.length-1,reasoningIndex+1);reasoningChoice=null;render();return}if(act==='reason-prev'){reasoningIndex=Math.max(0,reasoningIndex-1);reasoningChoice=null;render();return}if(act==='reason-restart'){reasoningIndex=0;reasoningChoice=null;render();return}if(act==='comp-tab'){comparisonTab=id;render();return}if(act==='chart-open'){chartIndex=+id;render();return}if(act==='sort-select'){let i=+id;selectedTerm=selectedTerm===i?null:i;render();return}if(act==='sort-define'){termInfo=+id;render();return}if(act==='sort-place'){if(selectedTerm!==null){placeTerm(selectedTerm,id)}return}if(act==='sort-return'){let p=sortRecords[compareId]||{};delete p[id];sortRecords[compareId]=p;checkCompare=false;sortSave();render();return}if(act==='sort-check'){checkCompare=true;render();return}if(act==='sort-reset'){sortRecords[compareId]={};selectedTerm=null;checkCompare=false;termInfo=null;sortSave();render();return}

nction tested by this question.")}</p>`}</div>`:''}<div class="actions"><button class="btn secondary" data-action="practice-next" ${!answered?'disabled':''}>${practiceIndex===practiceQuiz.length-1?'See results →':'Next question →'}</button>${btn('practice-restart','Start over','mini ghost')}</div></div></div>`}

<script>
/* V4: Blueprint-complete Unit Quizzes and classroom reference maps */
const v4QuizBank={1:[],2:[],3:[]};
function v4Add(u,q,opts,answer,why,tags=[],media=null){
 if(!v4QuizBank[u]||opts.length!==4||!Number.isInteger(answer)||answer<0||answer>3)throw Error('Invalid quiz question '+q);
 v4QuizBank[u].push({q,options:opts,answer,why,tags,media});
}
// UNIT 1: every listed 1.1 and 1.2 concept is tested, with repeated retrieval of the central ideas.
v4Add(1,'What does the Out of Africa Theory explain?',['The spread of crops from Southwest Asia','The origins of modern humans in Africa and their later migrations','The beginning of large ancient empires','The first use of metal farming tools'],1,'The Out of Africa theory describes where modern humans evolved and how populations spread, not the invention or diffusion of agriculture.',['out_of_africa']);
v4Add(1,'Look at this map. What do the routes primarily trace?',['Early modern human migration from Africa','Roman military campaigns','Diffusion of wheat farming','Territories of river-valley civilizations'],0,'These paths show early human movements outward from Africa. They are not the arrows on the agriculture map.',['out_of_africa','migration_vs_agriculture'],'migration');
v4Add(1,'In the course blueprint, what does Homo sapiens sapiens refer to?',['The earliest domesticated animals','A specific Neolithic farming technique','An early Mesopotamian government','Anatomically modern humans'],3,'Homo sapiens sapiens is a term for modern humans; it is not a farming practice or political institution.',['homo_sapiens_sapiens']);
v4Add(1,'Which description best matches the Paleolithic Age?',['The New Stone Age of villages and domesticated crops','The era of the first Greek democracies','The Old Stone Age, when people mainly hunted and gathered','The age when empires depended on imperial roads'],2,'The Paleolithic, or Old Stone Age, was characterized mainly by hunting and gathering long before farming became widespread.',['paleolithic_age']);
v4Add(1,'How did gathering and hunting groups usually obtain food?',['By cultivating large permanent grain fields','By collecting wild plants and hunting or fishing','By importing all grain from other empires','By taxing settled farmers'],1,'Paleolithic subsistence centered on wild resources; domestic farming is characteristic of the later Neolithic transition.',['gathering_hunting']);
v4Add(1,'Why did many Paleolithic communities practice a nomadic way of life?',['They moved to follow changing wild food and water supplies','They needed to govern large farming towns','They were forced to relocate by Roman officials','They traveled only to exchange written laws'],0,'Nomadic movement helped many communities track seasonal resources instead of remaining near cultivated fields.',['nomadic']);
v4Add(1,'What were kinship groups?',['Large states united by a single written constitution','Professional groups organized by occupation','Networks of related people who often supported each other','Permanent armies recruited by emperors'],2,'Kinship groups were based on family and social relationships and were important to cooperation and survival.',['kinship_groups']);
v4Add(1,'Which was an important result of the domestication or control of fire?',['The immediate invention of agriculture','The end of mobility everywhere','The invention of hieroglyphics','Cooking food and providing warmth and protection'],3,'Controlling fire made cooking, warmth, safety, and adaptation easier; it did not automatically create farms or cities.',['domestication_fire']);
v4Add(1,'Why did controlling fire help early humans live in new environments?',['Fire created food surpluses without food gathering','Cooking and warmth helped people cope with colder areas','Fire immediately caused the Neolithic Revolution','Fire made all communities permanently sedentary'],1,'Fire contributed to survival and adaptation, but early groups could still remain mobile hunter-gatherers.',['domestication_fire','adaptation']);
v4Add(1,'What is the most accurate statement about gender roles in Paleolithic groups?',['Women and men always performed exactly the same work in every group','All communities had the same rigid laws for every task','Responsibilities and roles could vary among communities and environments','Gender roles were determined by written royal decrees'],2,'Gender roles existed and varied between communities; it is inaccurate to assume a single universal arrangement.',['gender_roles']);
v4Add(1,'An egalitarian community is one with...',['relatively limited formal differences in power and social rank','strict hereditary social classes ruled by nobility','a permanent empire controlling several provinces','a large bureaucracy organized around written law'],0,'Egalitarian describes a relatively equal social structure, not the more formal hierarchies common in many later states.',['egalitarian']);
v4Add(1,'What is a broad-spectrum diet?',['Eating only domesticated wheat','Relying on one livestock species','Eating only foods grown near a permanent village','Using a wide range of wild plants and animals as food'],3,'A broad-spectrum diet uses many available wild food sources. This variety could reduce dependence on a single crop.',['broad_spectrum_diets']);
v4Add(1,'Which comparison of Paleolithic and Neolithic diets is best?',['Paleolithic groups ate only meat; Neolithic farmers ate only grain','Paleolithic groups often used diverse wild foods; farmers could depend more on cultivated staples','Both relied entirely on imported rice','Neolithic communities stopped using wild resources altogether'],1,'Many hunter-gatherers had varied wild diets; agriculture could bring stable staples but also greater dependence on particular crops.',['broad_spectrum_diets','comparison']);

v4Add(1,'What is one major way food production could change settlement patterns?',['It always caused everyone to become nomadic','It ended environmental challenges','Reliable cultivated fields could encourage permanent villages','It prevented cooperation among families'],2,'Maintaining fields and storing harvests encouraged settlement in many farming regions.',['sedentary','food_surplus','neolithic_revolution']);

 1:{name:'Early Human Societies',focus:'Paleolithic and Neolithic',desc:'Migration from Africa, hunter-gatherers, agriculture, domestication, and social change.'},

function v4Load(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}
let v4Answers=v4Load('h6-v4-unit-quiz-answers',{1:{},2:{},3:{}});
let v4Indices=v4Load('h6-v4-unit-quiz-positions',{1:0,2:0,3:0});
for(const u of [1,2,3]){v4Answers[u] ||= {};v4Indices[u] ||= 0;}
function v4Save(){try{localStorage.setItem('h6-v4-unit-quiz-answers',JSON.stringify(v4Answers));localStorage.setItem('h6-v4-unit-quiz-positions',JSON.stringify(v4Indices))}catch{}}
const v4OldPracticeView=practiceView;
const v4OldMapViewScoped=mapViewScoped;
const v4OldHomeViewScoped=homeViewScoped;
const v4OldEnhancedAction=enhancedAction;
const v4OldNavigate=navigate;
const v4OldRenderNav=renderNav;
function v4Image(name,quiz=false){
 let alt={migration:quiz?'World map containing routes and regions for a history question':'Student-supplied Out of Africa migration map with labeled routes',agriculture:quiz?'Map showing farming centers and directional arrows':'Student-supplied origins and diffusion of agriculture map',persia:quiz?'Shaded historical territory across Southwest Asia and neighboring regions':'Student-supplied map of the Achaemenid Persian Empire',rome:quiz?'Red-shaded historical territory including much of the Mediterranean':'Student-supplied map of the Roman Empire'}[name];
 return `<img src="${v4MapAssets[name]}" alt="${esc(alt)}" loading="lazy" decoding="async" />`;
}
function v4StudyMapGallery(){
 const cards=[
 {id:'migration',tag:'UNIT 1 · PALEOLITHIC',title:'Out of Africa — Human Migration',note:'Trace early modern-human migration routes outward from Africa. These arrows represent movement of people, not the beginnings of farming.'},
 {id:'agriculture',tag:'UNIT 1 · NEOLITHIC',title:'Origins & Spread of Agriculture',note:'Yellow circles show core agricultural areas. Red arrows show the spread of agriculture. Locate the Fertile Crescent in the Middle East.'},
 {id:'persia',tag:'UNIT 3 · PERSIA',title:'Achaemenid Persian Empire',note:'Recognize the broad inland empire across Southwest Asia, the Iranian plateau, Egypt, Anatolia, and territory farther east.'},
 {id:'rome',tag:'UNIT 3 · ROME',title:'Roman Empire',note:'Recognize the distinctive territory spread around the Mediterranean, including parts of Europe, North Africa, and Southwest Asia.'}
 ];
 return `<section class="v4-reference-maps"><div class="eyebrow">CLASSROOM REFERENCE MAPS</div><h2 class="section-title">Know these four maps</h2><p class="muted">These are the maps you were given to study. The <b>Unit Quizzes</b> also use these images for map-identification questions.</p><div class="v4-map-grid">${cards.map(c=>`<article class="v4-map-card"><span class="unit-pill">${esc(c.tag)}</span><h3>${esc(c.title)}</h3><figure>${v4Image(c.id)}<figcaption>${esc(c.note)}</figcaption></figure></article>`).join('')}</div><div class="actions">${btn('v4-open-quiz-home','Practice with the maps →','mini secondary')}</div></section>`;
}
mapViewScoped=function(){let base=v4OldMapViewScoped();if(screen==='unit4')return base;return v4StudyMapGallery()+base;};
function v4UnitQuizLanding(){
 return `${title('PRE-COMPREHENSIVE PRACTICE','Unit Quizzes','Select a unit to practice. These quizzes cover the 2026–27 pre-comp blueprint for Units 1–3. Unit 4 is deliberately excluded.')}
 <div class="study-alert"><b>Tested units:</b> Units 1, 2 and 3 each account for approximately one-third of the pre-comp. Unit 4 is not tested. All quizzes explain answers when you miss a question.</div>
 <div class="v4-quiz-grid">${[1,2,3].map(u=>{let m=v4UnitMeta[u],count=v4QuizBank[u].length,done=Object.keys(v4Answers[u]).length;return `<article class="tile v4-unit-quiz"><span class="unit-pill">UNIT ${u}</span><h2>${esc(m.name)}</h2><p><b>${esc(m.focus)}</b></p><p>${esc(m.desc)}</p><div class="barline"><span>${count} questions</span><span>${done} answered</span></div>${bar(done,count)}<div class="actions">${btn('v4-quiz-open',done?'Resume Unit '+u+' quiz →':'Start Unit '+u+' quiz →','mini secondary',u)}</div></article>`}).join('')}</div>
 <div class="v4-coverage-note"><b>Unit 1 coverage check:</b> ${v4Unit1Coverage.length} of ${v4Unit1Coverage.length} listed blueprint concepts have one or more questions, and the major topics are revisited in different contexts. The two reference maps also appear in its quiz.</div>`;
}
function v4QuizMedia(q){return q.media?`<figure class="v4-quiz-map">${v4Image(q.media,true)}<figcaption>Study the map above before you choose your answer. The question asks you to interpret its geography or symbols.</figcaption></figure>`:''}
function v4QuizPage(){
 if(v4SelectedQuiz===null)return v4UnitQuizLanding();
 const unit=v4SelectedQuiz, qs=v4QuizBank[unit],idx=v4Indices[unit],answers=v4Answers[unit],correctSoFar=Object.entries(answers).filter(([k,v])=>qs[+k]&&qs[+k].answer===v).length,m=v4UnitMeta[unit];
 if(idx>=qs.length){let missed=qs.map((q,i)=>({q,i})).filter(({q,i})=>answers[i]!==q.answer);return `${title('UNIT '+unit+' · PRACTICE RESULTS','Unit '+unit+' quiz complete','Review your mistakes, then return to the same questions for another attempt.')}
 <div class="panel practice-summary"><h2 class="section-title">${correctSoFar} / ${qs.length} correct</h2><div class="barline"><span>${Math.round(correctSoFar/qs.length*100)}% accuracy</span><span>${missed.length} missed</span></div>${bar(correctSoFar,qs.length)}
 ${missed.length?`<h3 style="margin-top:22px">Questions to review</h3>${missed.map(({q,i})=>`<div class="quiz-result"><strong>Question ${i+1}: ${esc(q.q)}</strong><p>Your choice: ${esc(q.options[answers[i]])}</p><p>Correct answer: <b>${esc(q.options[q.answer])}</b></p><p>${esc(q.why)}</p></div>`).join('')}`:'<p style="margin-top:16px">You answered every question correctly.</p>'}<div class="actions">${btn('v4-quiz-restart','Try Unit '+unit+' again','secondary')}${btn('v4-quiz-home','All Unit Quizzes','mini ghost')}</div></div>`;}
 const q=qs[idx],selected=answers[idx],answered=selected!==undefined,correct=selected===q.answer;
 return `${title('UNIT '+unit+' · PRE-COMP PRACTICE','Unit '+unit+' Quiz',m.focus+' — '+qs.length+' questions with explanations and map-based review.')}
 <div class="quiz v4-quiz-wrap"><div class="crumb">${btn('v4-quiz-home','← All Unit Quizzes','mini ghost')} &nbsp; / &nbsp; Unit ${unit}</div>
 <div class="panel"><div class="barline"><span><b>Question ${idx+1} of ${qs.length}</b></span><span>${Object.keys(answers).length} answered · ${correctSoFar} correct</span></div>${bar(Object.keys(answers).length,qs.length)}
 <div class="v4-question-tags">${q.tags.slice(0,2).map(t=>`<span class="unit-pill">${esc(v4CoverageTargets[t]||t.replace(/_/g,' '))}</span>`).join('')}</div>${v4QuizMedia(q)}<h3 class="v4-question-title">${esc(q.q)}</h3>
 <div class="practice-answers">${q.options.map((o,i)=>`<button type="button" class="choice ${answered&&i===q.answer?'correct':''} ${answered&&i===selected&&i!==q.answer?'incorrect':''}" data-action="v4-quiz-answer" data-id="${i}" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
 ${answered?`<div class="feedback ${correct?'':'bad'}" role="status"><b>${correct?'Correct!':'Not quite.'}</b> ${esc(q.why)}${correct?'':`<p>The correct choice is <b>${esc(q.options[q.answer])}</b>. Your selected option describes a different concept, place, or process.</p>`}</div>`:''}
 <div class="actions"><button type="button" class="btn secondary" data-action="v4-quiz-next" ${answered?'':'disabled'}>${idx===qs.length-1?'See my results →':'Next question →'}</button><button type="button" class="btn mini ghost" data-action="v4-quiz-prev" ${idx===0?'disabled':''}>← Previous</button>${btn('v4-quiz-restart','Restart Unit '+unit,'mini ghost')}</div></div></div>`;
}
practiceView=function(){return v4QuizPage()};
function v4HomeFix(){let out=v4OldHomeViewScoped();return out.replaceAll('Unit 1 Quiz','Unit Quizzes').replaceAll('Unit 1 Practice Quiz','Unit Quizzes').replaceAll('18 mixed questions','separate quizzes for Units 1–3').replaceAll('18 questions','unit-specific questions').replaceAll('Start the quiz','Choose a Unit Quiz').replaceAll('Start Unit 1 Quiz','Open Unit Quizzes').replaceAll('Unit 1 practice quiz','Unit Quizzes')}
homeViewScoped=function(){return v4HomeFix()};
navigate=function(to){if(to==='practice'){v4SelectedQuiz=null}v4OldNavigate(to)};
renderNav=function(){v4OldRenderNav();if(screen==='practice')document.title='Origins & Empires · Unit Quizzes';};
enhancedAction=function(act,id){
 if(act==='v4-quiz-home'||act==='v4-open-quiz-home'){screen='practice';v4SelectedQuiz=null;render();window.scrollTo({top:0,behavior:'instant'});return}
 if(act==='v4-quiz-open'){v4SelectedQuiz=+id;screen='practice';render();window.scrollTo({top:0,behavior:'instant'});return}
 if(act==='v4-quiz-answer'){let u=v4SelectedQuiz,idx=v4Indices[u];if(v4Answers[u][idx]===undefined){v4Answers[u][idx]=+id;v4Save();render()}return}
 if(act==='v4-quiz-next'){let u=v4SelectedQuiz,idx=v4Indices[u];if(v4Answers[u][idx]!==undefined){v4Indices[u]++;v4Save();render();window.scrollTo({top:0,behavior:'instant'})}return}
 if(act==='v4-quiz-prev'){let u=v4SelectedQuiz;if(v4Indices[u]>0){v4Indices[u]--;v4Save();render()}return}
 if(act==='v4-quiz-restart'){let u=v4SelectedQuiz;v4Answers[u]={};v4Indices[u]=0;v4Save();render();window.scrollTo({top:0,behavior:'instant'});return}
 if(act==='goto'&&id==='practice'){v4SelectedQuiz=null}
 return v4OldEnhancedAction(act,id)
};
render();

</script></body></html>
